name: design system in sync

# The prototypes here load tokens.css / foundation.css / components.css / icons.js
# from the repo root, so this repo keeps a copy of them. The design system itself
# lives in effectory-ux/Engage-Design-system-. Copies drift silently — this fails
# the build when they do, instead of leaving prototypes on an older design system.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare against the published design system
        run: ./refresh-design-system.sh --check
