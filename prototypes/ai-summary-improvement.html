<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI summary improvement — Results overview</title>
  <base href="../" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="foundation.css" />
  <link rel="stylesheet" href="components.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg-interface-body);
      color: var(--content-base);
      font-family: 'Poppins', sans-serif;
      /* Results page container padding (Figma: results/padding) — built from spacing tokens */
      --results-side: calc(var(--spacing-extra-loose) * 2); /* 64px — desktop page padding (design system §11) */
      --results-top: calc(var(--spacing-loose) * 2);        /* 48px — container-top-bot */
    }

    /* App shell */
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* Language popover (sidebar user block) */
    .mn-user { position: relative; cursor: pointer; }
    .lang-pop {
      position: absolute; bottom: calc(100% + var(--spacing-tight)); left: 0; right: 0;
      display: flex; flex-direction: column; gap: 2px;
      padding: var(--spacing-extra-tight);
      background: var(--bg-base); border: 1px solid var(--border-base);
      border-radius: var(--radius-md); box-shadow: var(--sh-popovers); z-index: 60;
    }
    .lang-pop[hidden] { display: none; }
    .lang-opt {
      display: flex; align-items: center;
      padding: var(--spacing-tight) var(--spacing-base-tight);
      border: 0; background: none; border-radius: var(--radius-base);
      font-family: inherit; font-size: 14px; color: var(--content-base);
      text-align: left; cursor: pointer;
    }
    .lang-opt:hover { background: var(--bg-secondary); }
    .lang-opt.is-active { font-weight: 600; color: var(--content-brand); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .main-scroll { flex: 1; overflow-y: auto; }

    /* Animated switch between views (View Transitions API): a soft focus-pull —
       the whole screen blurs out and the new view sharpens back into focus. */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: vt-blur-out 2.6s linear both; }
    ::view-transition-new(root) { animation: vt-blur-in 2.6s linear both; }
    /* fast blur-in (~0.2s) -> hold blurred (~2s) -> fast sharpen (~0.4s) */
    @keyframes vt-blur-out {
      0%   { filter: blur(0);    opacity: 1; transform: scale(1); }
      8%   { filter: blur(20px); opacity: 0; transform: scale(1.06); }
      100% { filter: blur(20px); opacity: 0; transform: scale(1.06); }
    }
    @keyframes vt-blur-in {
      0%   { filter: blur(20px); opacity: 0; transform: scale(1.06); }
      8%   { filter: blur(20px); opacity: 1; transform: scale(1.06); }
      85%  { filter: blur(20px); opacity: 1; transform: scale(1.06); }
      100% { filter: blur(0);    opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    }

    /* Header zone (title, filters, tabs) */
    .results-head {
      padding: var(--results-top) var(--results-side) 0;
    }
    /* Align the breadcrumb content to the same container edge */
    .breadcrumb {
      padding-left: var(--results-side);
      padding-right: var(--results-side);
    }
    .results-title { margin: 0 0 var(--spacing-base); cursor: pointer; width: fit-content; }
    .results-filters {
      display: flex;
      align-items: center;
      gap: var(--spacing-base);
      margin-bottom: var(--spacing-loose);
    }
    .date-range {
      display: flex;
      align-items: center;
      gap: var(--spacing-tight);
      cursor: pointer;
      color: var(--content-secondary);
      font-size: 14px;
      font-weight: 500;
    }
    .date-range i { color: var(--content-subtle); }
    .results-head .tabs { padding: 0 var(--results-side); margin: 0 calc(-1 * var(--results-side)); }
    .results-head .tab .tab-spark { width: 18px; height: 18px; color: var(--bg-highlight-base); }

    /* ── Overview content — centred column ── */
    .overview-wrap {
      max-width: 1248px; /* 1200px grid + 24px padding aan weerszijden */
      margin: 0 auto;
      padding: var(--spacing-super-loose) var(--spacing-loose) var(--spacing-super-extra-loose);
    }
    /* Data-heavy table views (Scores) use the full-width container per the design system */
    .overview-wrap.is-full {
      max-width: none;
      padding-left: var(--results-side);
      padding-right: var(--results-side);
    }

    /* ── Grid: alle kaarten max 384×456, 24px ertussen ── */
    .ov-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 384px));
      gap: var(--spacing-loose);
      justify-content: center;
      width: 100%;
      max-width: 1200px;  /* 3×384 + 2×24 — matches the AI summary width */
      margin: 0 auto;
    }
    /* AI summary tracks the grid width at every breakpoint so their edges line up */
    @media (max-width: 1300px) {
      .ov-grid { grid-template-columns: repeat(2, minmax(0, 384px)); }
      .ai-summary, .ov-grid { max-width: 792px; } /* 2×384 + 24 */
    }
    @media (max-width: 870px) {
      .ov-grid { grid-template-columns: minmax(0, 384px); }
      .ai-summary, .ov-grid { max-width: 384px; }
    }

    /* ── Gedeelde kaart-shell ── */
    .card {
      box-sizing: border-box;
      width: 100%;
      max-width: 384px;
      height: 456px;
      background: var(--bg-base);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-lg);
      box-shadow: var(--sh-card);
      padding: var(--spacing-loose);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-base);
    }

    /* tooltips op icon buttons: verborgen tot hover/focus */
    .tt-demo .tooltip {
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-fast) var(--ease-out);
    }
    .tt-demo:hover .tooltip,
    .tt-demo:focus-within .tooltip {
      opacity: 1;
    }

    /* ════ Effectiveness (kwadrant) ════ */
    .fx-card { gap: var(--spacing-extra-tight); }
    .fx-header { display: flex; align-items: center; gap: var(--spacing-base-tight); }
    .fx-title { flex: 1; margin: 0; }
    .fx-axis { margin: 0; font-size: 14px; line-height: 1.6; color: var(--content-secondary); }
    .fx-axis.is-x { text-align: right; }
    .fx-body { flex: 1; display: flex; flex-direction: column; gap: var(--spacing-tight); min-height: 0; }
    .fx-matrix {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: var(--spacing-extra-tight);
    }
    .fx-quad {
      display: flex; align-items: center; justify-content: center;
      padding: var(--spacing-base);
      font-size: 12px; font-weight: 600; line-height: 1.6; text-align: center;
    }
    .fx-quad.is-detached { background: var(--bg-tertiary); color: var(--content-secondary); border-top-left-radius: var(--radius-lg); }
    .fx-quad.is-effective { background: var(--bg-accent-green-subtle); color: var(--content-accent-green); border-top-right-radius: var(--radius-lg); }
    .fx-quad.is-ineffective { background: var(--bg-accent-red-subtle); color: var(--content-accent-red); border-bottom-left-radius: var(--radius-lg); }
    .fx-quad.is-not-utilized { background: var(--bg-accent-yellow-subtle); color: var(--content-accent-yellow); border-bottom-right-radius: var(--radius-lg); }
    .fx-scale {
      position: absolute;
      font-size: 12px; font-weight: 500; line-height: 1.6;
      color: var(--content-secondary);
      padding: var(--spacing-extra-tight) var(--spacing-tight);
    }
    .fx-scale.is-top-left { top: 0; left: 0; }
    .fx-scale.is-bottom-left { bottom: 0; left: 0; }
    .fx-scale.is-bottom-right { bottom: 0; right: 0; }
    .fx-marker { position: absolute; width: 12px; height: 12px; transform: translate(-50%, -50%); }
    .fx-dot {
      width: 12px; height: 12px;
      border-radius: var(--radius-full);
      border: 2px solid var(--border-white);
      box-sizing: border-box;
    }
    .fx-chip {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px;
      padding: var(--spacing-extra-tight) var(--spacing-tight);
      border-radius: var(--radius-base);
      border: 2px solid var(--border-white);
      box-shadow: var(--sh-card);
      font-size: 12px; font-weight: 500; line-height: 1.6;
      white-space: nowrap;
    }
    .fx-marker.is-chip-above .fx-chip { bottom: calc(100% + var(--spacing-tight)); }
    .fx-marker.is-chip-below .fx-chip { top: calc(100% + var(--spacing-tight)); }
    .fx-chip i { display: flex; width: 12px; height: 12px; flex-shrink: 0; }
    .fx-marker.is-org .fx-dot { background: var(--content-secondary); }
    .fx-marker.is-org .fx-chip { background: var(--bg-tertiary); color: var(--content-base); }
    .fx-marker.is-current .fx-dot { background: var(--content-info-secondary); }
    .fx-marker.is-current .fx-chip { background: var(--bg-info); color: var(--content-inverse); }
    .fx-marker.is-previous .fx-dot { background: var(--content-info); }
    .fx-marker.is-previous .fx-chip { background: var(--bg-accent-blue-subtle); color: var(--content-info); }

    /* ════ eNPS ════ */
    .nps-header { display: flex; flex-direction: column; gap: var(--spacing-extra-tight); }
    .nps-title-row { display: flex; align-items: center; gap: var(--spacing-base-tight); }
    .nps-title { flex: 1; margin: 0; }
    .nps-desc { margin: 0; font-size: 14px; line-height: 1.6; color: var(--content-secondary); }
    .nps-icons { display: flex; align-items: center; gap: var(--spacing-extra-tight); }
    .nps-graph { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: var(--spacing-base); padding: var(--spacing-loose) 0 var(--spacing-loose) var(--spacing-loose); }
    .nps-donut { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
    .nps-donut canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    .nps-stats { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-base); }
    .nps-stat { display: flex; flex-direction: column; gap: var(--spacing-extra-tight); }
    .nps-stat-lbl { display: flex; align-items: center; gap: var(--spacing-extra-tight); font-size: 12px; font-weight: 500; line-height: 16px; color: var(--content-base); }
    .nps-stat-info-wrap { display: inline-flex; }
    .nps-stat-info { display: flex; width: 14px; height: 14px; color: var(--content-secondary); cursor: help; }
    .nps-stat-val-row { display: flex; align-items: center; gap: var(--spacing-tight); }
    .nps-stat-val { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--content-base); }
    .nps-trend {
      display: inline-flex; align-items: center; gap: var(--spacing-extra-tight);
      padding: 2px var(--spacing-extra-tight);
      background: var(--bg-base);
      border: 1px solid var(--border-positive);
      border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 500; line-height: 16px;
      color: var(--content-positive);
    }
    .nps-trend i { display: flex; width: 16px; height: 16px; }
    .nps-trend.is-down { border-color: var(--border-negative); color: var(--content-negative); }
    .nps-trend.is-flat { border-color: var(--border-base); color: var(--content-secondary); }
    .nps-donut-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; pointer-events: none;
    }
    .nps-donut-value { font-size: 32px; font-weight: 600; line-height: 40px; letter-spacing: -0.02em; color: var(--content-base); }
    .nps-donut-label { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--content-secondary); }
    .nps-rows { display: flex; flex-direction: column; gap: var(--spacing-tight); }
    .nps-row {
      box-sizing: border-box;
      display: flex; align-items: center; gap: var(--spacing-base);
      height: 48px; padding: 0 var(--spacing-base-tight);
      background: var(--bg-base);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; line-height: 20px; color: var(--content-base);
    }
    .nps-row-cat { flex: 1; display: flex; align-items: center; gap: var(--spacing-tight); min-width: 0; }
    .nps-row-cat i { display: flex; width: 24px; height: 24px; flex-shrink: 0; }
    .nps-row.is-promoters .nps-row-cat i { color: var(--bg-distribution-agree); }
    .nps-row.is-passives .nps-row-cat i { color: var(--bg-distribution-neither); }
    .nps-row.is-detractors .nps-row-cat i { color: var(--bg-distribution-disagree); }
    .nps-row-pct { width: 40px; text-align: right; }
    .nps-row-count { display: flex; align-items: center; gap: var(--spacing-tight); color: var(--content-secondary); }
    .nps-row-count span { width: 48px; text-align: right; }
    .nps-row-count i { display: flex; width: 16px; height: 16px; color: var(--content-base); }

    /* ════ Themes (spiderweb) ════ */
    .sw-card { align-items: center; justify-content: space-between; }
    .sw-header { display: flex; align-items: center; gap: var(--spacing-base-tight); width: 100%; }
    .sw-title { flex: 1; margin: 0; }
    .sw-icons { display: flex; align-items: center; gap: var(--spacing-extra-tight); }
    .sw-graph { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .sw-legend { display: flex; align-items: center; justify-content: center; gap: var(--spacing-loose); }
    .sw-legend-item {
      display: flex; align-items: center; gap: var(--spacing-tight);
      font-size: 12px; font-weight: 500; line-height: 16px; color: var(--content-base);
    }
    .sw-legend-dot { width: 8px; height: 8px; border-radius: var(--radius-full); }
    .sw-legend-dot.is-current { background: var(--bg-results-current); }
    .sw-legend-dot.is-previous { background: var(--bg-results-previous); }

    /* ════════════════════════════════════════════════
       Engagement tile (score + benchmark)
       ════════════════════════════════════════════════ */
    .card.eng-card { cursor: pointer; gap: var(--spacing-base); transition: box-shadow var(--motion-base) var(--ease-out); }
    .card.eng-card:hover { box-shadow: var(--sh-card-hover); }
    .card.nps-card { cursor: pointer; transition: box-shadow var(--motion-base) var(--ease-out); }
    .card.nps-card:hover { box-shadow: var(--sh-card-hover); }
    .eng-header { display: flex; flex-direction: column; gap: var(--spacing-extra-tight); }
    .eng-title-row { display: flex; align-items: center; gap: var(--spacing-base-tight); }
    .eng-title { flex: 1; margin: 0; }
    .eng-subtitle { margin: 0; font-size: 14px; line-height: 1.6; color: var(--content-secondary); }
    .eng-icons { display: flex; align-items: center; gap: var(--spacing-extra-tight); }
    .eng-icons .tooltip { opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out); }
    .eng-icons .tt-demo:hover .tooltip, .eng-icons .tt-demo:focus-within .tooltip { opacity: 1; }
    .eng-body {
      position: relative; flex: 1; min-height: 0; overflow: hidden;
      border: 1px solid var(--border-base); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .eng-wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 136px; display: block; }
    .eng-value {
      position: relative; z-index: 1;
      font-size: 42px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.5;
      color: var(--content-info);
    }
    .eng-trend {
      position: absolute; z-index: 2;
      right: var(--spacing-base-tight); bottom: var(--spacing-base-tight);
      display: flex; align-items: center; gap: var(--spacing-extra-tight);
      padding: 2px var(--spacing-extra-tight);
      background: var(--bg-base); border: 1px solid var(--border-positive);
      border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; color: var(--content-positive);
    }
    .eng-trend i { display: flex; width: 16px; height: 16px; }
    .eng-bench { display: flex; flex-direction: column; gap: var(--spacing-tight); }
    .eng-bench-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 14px; font-weight: 500; line-height: 20px; color: var(--content-base);
    }
    .eng-bench-track { height: 8px; background: var(--border-base); border-radius: var(--radius-full); overflow: hidden; }
    .eng-bench-fill { height: 100%; background: var(--bg-results-benchmark); border-radius: var(--radius-full); }

    /* ════════════════════════════════════════════════
       AI Summary (collapsible, above the grid)
       ════════════════════════════════════════════════ */
    .ai-summary {
      position: relative;   /* the collapsed state docks the toggle over the fading text */
      max-width: 1200px; margin: 0 auto var(--spacing-loose);
      background: var(--bg-base);
      border: 1px solid var(--border-info-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--sh-card);
      padding: var(--spacing-loose);
    }
    .ai-head { display: flex; align-items: center; gap: var(--spacing-base-tight); margin-bottom: var(--spacing-base); }
    .ai-head-left { display: flex; align-items: center; gap: var(--spacing-tight); flex: 1; }
    .ai-spark { display: flex; width: 22px; height: 22px; color: var(--content-info-secondary); }
    .ai-title { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; color: var(--content-info-secondary); }
    .ai-beta {
      display: inline-flex; align-items: center; padding: 2px var(--spacing-tight);
      background: var(--bg-info-subtle); color: var(--content-info);
      border-radius: var(--radius-full); font-size: 12px; font-weight: 500; line-height: 16px;
    }
    .ai-head-right { display: flex; align-items: center; gap: var(--spacing-extra-tight); }
    .ai-head-right .tooltip { opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out); }
    .ai-head-right .tt-demo:hover .tooltip, .ai-head-right .tt-demo:focus-within .tooltip { opacity: 1; }

    .ai-intro { margin: 0; font-size: 14px; line-height: 1.6; color: var(--content-base); }

    /* Collapsed summary: show a peek of the text and fade its bottom edge, so it reads as
       "there is more below" instead of a hard cut. Expanding animates the height (JS measures
       the content and sets max-height in px, then releases it to none once the motion ends). */
    .ai-collapse {
      position: relative;
      overflow: hidden;
      max-height: var(--ai-peek);
      transition: max-height var(--motion-slow) var(--ease-standard);
    }
    .ai-summary {
      /* The peek counts text lines (14px × 1.6 line-height); the fade is a slightly longer
         ramp so the text really dissolves instead of smudging across one line. The collapsed
         text runs on behind the Show more button and fades out there, so the peek covers the
         button strip too and the card lands at ~300px. */
      --ai-peek: calc(8 * 1.6 * 14px);
      --ai-fade: calc(3 * 1.6 * 18px);
      /* how far the text stops short of the button's bottom edge: the smaller this is,
         the further the fading text runs on behind the button */
      --ai-lift: var(--spacing-base);
    }
    .ai-summary:not(.is-open) .ai-collapse { margin-bottom: var(--ai-lift); }
    .ai-collapse::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0;
      height: var(--ai-fade);
      /* solid before the very bottom, so the button label never sits on legible text */
      background: linear-gradient(to bottom, transparent, var(--bg-base) 75%);
      transition: opacity var(--motion-base) var(--ease-out);
      pointer-events: none;
    }
    /* Collapsed: the toggle sits over the bottom of the text instead of below it */
    .ai-summary:not(.is-open) .ai-toggle-row {
      position: absolute; left: var(--spacing-loose); right: var(--spacing-loose);
      bottom: var(--spacing-loose); margin-top: 0;
    }
    .ai-summary.is-open .ai-collapse::after { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .ai-collapse, .ai-collapse::after { transition: none; }
    }
    .ai-more > p { margin: var(--spacing-tight) 0 0; font-size: 14px; line-height: 1.6; color: var(--content-base); }

    .ai-sec { margin-top: var(--spacing-loose); }
    .ai-sec-title { margin: 0 0 var(--spacing-tight); font-size: 14px; font-weight: 600; line-height: 22px; color: var(--content-base); }
    .ai-list { margin: 0; padding-left: var(--spacing-base); display: flex; flex-direction: column; gap: var(--spacing-tight); }
    .ai-list li { font-size: 14px; line-height: 1.6; color: var(--content-base); }

    .ai-foot { margin-top: var(--spacing-loose); }
    .ai-feedback { display: flex; gap: var(--spacing-base); }
    .ai-fb { height: auto; padding: var(--spacing-extra-tight) var(--spacing-tight); margin-left: calc(-1 * var(--spacing-tight)); font-weight: 500; }
    .ai-fb i { display: flex; width: 16px; height: 16px; }
    .ai-disclaimer { margin: var(--spacing-base-tight) 0 0; padding-top: var(--spacing-base-tight); border-top: 1px solid var(--border-base); font-size: 12px; line-height: 1.6; color: var(--content-secondary); }

    /* "How this summary is created" dialog, opened from the disclaimer's Learn more */
    /* .overlay is display:flex, which would otherwise beat the [hidden] UA rule */
    .overlay[hidden] { display: none; }
    .ai-info-body { display: flex; flex-direction: column; gap: var(--spacing-base); }
    .ai-info-body p { margin: 0; }
    /* the two lead paragraphs run at 14px, like the rest of the summary copy */
    .ai-info-body > p { font-size: 14px; line-height: 1.6; }
    .ai-info-about { padding-top: var(--spacing-base); border-top: 1px solid var(--border-base); }
    .ai-info-about-title { margin: 0 0 var(--spacing-tight); font-size: 14px; font-weight: 600; line-height: 22px; color: var(--content-base); }
    .ai-info-fine { font-size: 14px; line-height: 1.6; color: var(--content-secondary); }

    /* Show more / less is a design-system tertiary button, centred under the summary */
    .ai-toggle-row { display: flex; justify-content: center; margin-top: var(--spacing-base); }
    .ai-toggle i { display: flex; width: 16px; height: 16px; }
    .ai-summary:not(.is-open) .ai-toggle .ai-toggle-less,
    .ai-summary.is-open .ai-toggle .ai-toggle-more { display: none; }
    .ai-toggle-more, .ai-toggle-less { display: inline-flex; align-items: center; gap: var(--spacing-tight); }
    .efp-lead-em.is-pos { text-decoration-color: var(--bg-accent-green-subtle); }

    /* ──────────────────────────────────────────────
       Responsiveness
       ────────────────────────────────────────────── */
    /* Tablet page padding (design system §11: below the 1200px desktop breakpoint) */
    @media (max-width: 1199px) {
      body { --results-side: var(--spacing-loose); } /* 24px */
    }
    /* Collapse the app sidebar so content gets the full width */
    @media (max-width: 900px) {
      .mainnav { display: none; }
    }
    /* Phone / small tablet */
    /* Mobile page padding (design system §11: below 576px) */

      body { --results-side: var(--spacing-base); } /* 16px */
    }
    @media (max-width: 768px) {
      .overview-wrap { padding: var(--spacing-loose) var(--spacing-base) var(--spacing-extra-loose); }
      .results-head { padding-top: var(--spacing-loose); }
    }

    /* SOS themes */

    "Facilitating employees": { nl: "Medewerkers faciliteren", de: "Mitarbeitende befähigen" },

    "Giving direction": { nl: "Richting geven", de: "Richtung geben" },
    /* SOS theme descriptions (from Demo input.xlsx) */
    "Well-managed systems enable employees to reach the expected performance by providing them with the necessary working conditions. This includes good working tools, effective work processes, good collaboration on different levels, and the availability of development opportunities.": { nl: "Goed beheerde systemen stellen werknemers in staat om de verwachte prestaties te leveren door ze de nodige werkomstandigheden te bieden. Dit omvat goede werkinstrumenten, effectieve werkprocessen, goede samenwerking op verschillende niveaus en de beschikbaarheid van ontwikkelingsmogelijkheden.", de: "Gut verwaltete Systeme bieten Mitarbeitenden die notwendigen Arbeitsbedingungen, um die von ihnen erwartete Leistung zu erreichen. Dazu gehören entsprechende Arbeitsinstrumente, effektive Arbeitsprozesse, eine gute Zusammenarbeit auf verschiedenen Ebenen und Entwicklungsmöglichkeiten." },
    "People management ensures employees know the company’s expectations and can apply their knowledge and skills accordingly. This includes constructive feedback and recognition to show that good performance is acknowledged and well-rewarded in the company.": { nl: "Mensenmanagement zorgt ervoor dat werknemers de verwachtingen van het bedrijf kennen en hun kennis en vaardigheden op basis hiervan kunnen toepassen. Dit omvat constructieve feedback en erkenning, om te laten zien dat goede prestaties worden onderkend en beloond in het bedrijf.", de: "„Mitarbeiter führen\" bezieht sich darauf, ob die Mitarbeitenden die Erwartungen des Unternehmens kennen und ihre Expertise und ihre Fähigkeiten entsprechend anwenden können. Dazu gehören konstruktives Feedback und Anerkennung, um zu zeigen, dass gute Leistungen im Unternehmen anerkannt und belohnt werden." },
    "Leading Change should aim to let employees know what has to be changed, why, and how, and to obtain their backing for the necessary changes. For this, managers need to involve their teams in the process so that they understand and trust them. Involvement is particularly important in unsettling situations that inevitably occur during ongoing change.": { nl: "Leiderschap bij verandering is bedoeld om werknemers te laten weten wat er moet veranderen, waarom en hoe, en hun steun te krijgen voor de noodzakelijke veranderingen. Hiervoor moeten managers hun teams bij het proces betrekken, zodat ze de veranderingen begrijpen en er vertrouwen in hebben. Betrokkenheid is vooral belangrijk in verontrustende situaties die onvermijdelijk optreden tijdens voortdurende verandering.", de: "„Veränderung gestalten\" zielt darauf ab, die Mitarbeitenden darüber zu informieren, welche Änderungen notwendig sind, weshalb diese durchgeführt werden und wie genau. Wenn ausreichend informiert wird, können Mitarbeitende auch Vertrauen entwickeln und Unterstützung für die notwendigen Änderungen zeigen. Engagement ist besonders wichtig in unsicheren Situationen, die bei laufenden Veränderungen unvermeidlich auftreten." },
    "Providing Direction should aim to make employees enthusiastic about the company’s vision, familiar with and convinced by the company’s strategy, and feel treated in a fair and just manner within the overall “ecosystem” of their company. Then, the employees will also be willing to go along with strategically necessary changes.": { nl: "Richting geven is bedoeld om werknemers enthousiast te maken voor de visie van het bedrijf, bekend te maken met en te overtuigen van de strategie van het bedrijf, en het gevoel te geven dat ze op een eerlijke en rechtvaardige manier worden behandeld binnen het algemene 'ecosysteem' van hun bedrijf. Dan zullen de werknemers ook bereid zijn om mee te gaan in strategisch noodzakelijke veranderingen.", de: "„Richtung geben\" zielt darauf ab, Mitarbeitende für die Vision des Unternehmens zu begeistern, mit der Strategie des Unternehmens vertraut zu machen und von der Strategie überzeugt zu sein. Weiterhin sollen sich Mitarbeitende innerhalb des gesamten „Ökosystems“ ihres Unternehmens fair und gerecht behandelt zu fühlen. Wenn das der Fall ist, sind Mitarbeitende auch bereit, strategisch notwendige Veränderungen mitzumachen." },
    "Organizations that work on employer excellence provide their employees with a work environment where they feel at home and accepted. Such a work environment enhances your employees' feeling of being connected with their colleagues and your organization. High scores on employer excellence mean your employees feel part of a community, appreciated, inspired, and cared for at your organization. In such an environment, your employees will perform better and remain with the organization for a longer period because they are intrinsically motivated.": { nl: "Organisaties die werk maken van werkgeverschap bieden hun medewerkers een werkomgeving waarin zij zich thuis en geaccepteerd voelen. Zo'n werkomgeving leidt ertoe dat je medewerkers zich meer verbonden voelen met hun collega's en je organisatie. Hoge scores op werkgeverschap wijzen erop dat je medewerkers voelen dat ze deel uitmaken van een gemeenschap. Zij voelen zich gewaardeerd en geïnspireerd en hebben het idee dat je organisatie het beste met hen voor heeft. In zo’n omgeving zullen je medewerkers beter presteren. Ze zullen hierdoor ook langer bij je organisatie blijven omdat ze intrinsiek gemotiveerd zijn.", de: "Unternehmen, die ihre Qualitäten als Arbeitgeber kultivieren, bieten ihren Mitarbeitenden ein Arbeitsumfeld, in dem diese sich wohl und akzeptiert fühlen. Ein solches Arbeitsumfeld stärkt das Gefühl der Verbundenheit Ihrer Mitarbeitenden mit den Kolleg:innen und Ihrem Unternehmen. Ein hoher Punktewert bei „Arbeitgeberkompetenz” bedeutet entsprechend, dass sich Ihre Mitarbeitenden im Unternehmen als Teil einer Gemeinschaft bzw. geschätzt, inspiriert und umsorgt fühlen. In einem solchen Umfeld liefern Ihre Mitarbeitenden bessere Leistungen und bleiben länger im Unternehmen, weil sie intrinsisch motiviert sind." },
    "In essence, customer focus is about identifying the customer's wishes and requirements, anticipating these wishes and acting on them to build lasting relationships.": { nl: "Klantgerichtheid draait in essentie om het herkennen van de wensen en behoeften van de klant, daarop anticiperen en ernaar handelen om duurzame relaties op te bouwen.", de: "Im Kern geht es bei der Kundenorientierung darum, die Wünsche und Anforderungen der Kunden zu erkennen, sie vorwegzunehmen und danach zu handeln, um dauerhafte Beziehungen aufzubauen." },
    "Vitality covers both the mental and physical vitality of employees. Mental vitality refers to the mental state of an employee and their ability to recover and stay resilient.": { nl: "Vitaliteit omvat zowel de mentale als fysieke vitaliteit van medewerkers. Mentale vitaliteit verwijst naar de mentale toestand van een medewerker en het vermogen om te herstellen en veerkrachtig te blijven.", de: "Vitalität umfasst sowohl die mentale als auch die körperliche Vitalität der Mitarbeitenden. Mentale Vitalität bezieht sich auf den mentalen Zustand einer Person und ihre Fähigkeit, sich zu erholen und widerstandsfähig zu bleiben." },
    "On top of effectiveness, it's important that employees are given the ability to work efficiently. Efficiency is about the capacity to achieve results with minimal wasted effort.": { nl: "Naast effectiviteit is het belangrijk dat medewerkers in staat worden gesteld om efficiënt te werken. Efficiëntie gaat over het vermogen om resultaten te behalen met zo min mogelijk verspilde moeite.", de: "Neben der Effektivität ist es wichtig, dass Mitarbeitende effizient arbeiten können. Effizienz bedeutet, Ergebnisse mit möglichst geringem Aufwand zu erzielen." },
    "Engagement is the degree to which your employees feel inspired and energized by their work. It reflects their positive connection to your organization and their willingness to go the extra mile.": { nl: "Bevlogenheid is de mate waarin medewerkers zich geïnspireerd en energiek voelen door hun werk. Het weerspiegelt hun positieve band met de organisatie en hun bereidheid om een stapje extra te zetten.", de: "Engagement ist das Ausmaß, in dem sich Ihre Mitarbeitenden durch ihre Arbeit inspiriert und voller Energie fühlen. Es spiegelt ihre positive Verbindung zur Organisation und ihre Bereitschaft wider, sich besonders einzusetzen." },
    "Employee satisfaction is the sense of well-being that employees experience because of their job. A satisfied employee is content with their role, conditions and environment.": { nl: "Medewerkerstevredenheid is het gevoel van welzijn dat medewerkers ervaren door hun werk. Een tevreden medewerker is content met zijn rol, arbeidsvoorwaarden en omgeving.", de: "Mitarbeiterzufriedenheit ist das Wohlbefinden, das Mitarbeitende durch ihre Arbeit erleben. Ein zufriedener Mitarbeitender ist mit seiner Rolle, den Bedingungen und dem Umfeld zufrieden." },
    "Willingness to change reflects how open and ready employees are to adapt to new ways of working, embrace improvements and support the organization through change.": { nl: "Veranderbereidheid weerspiegelt hoe open en klaar medewerkers zijn om zich aan te passen aan nieuwe manieren van werken, verbeteringen te omarmen en de organisatie te steunen bij verandering.", de: "Veränderungsbereitschaft spiegelt wider, wie offen und bereit Mitarbeitende sind, sich an neue Arbeitsweisen anzupassen, Verbesserungen anzunehmen und die Organisation durch Veränderungen zu unterstützen." },

    "This summary is generated using your team's theme scores. It compares current results with previous surveys and relevant benchmarks to highlight key trends and notable changes over time.": { nl: "Deze samenvatting is gemaakt op basis van de themascores van je team. Ze vergelijkt de huidige resultaten met eerdere onderzoeken en relevante benchmarks om belangrijke trends en opvallende veranderingen in de tijd te laten zien.", de: "Diese Zusammenfassung basiert auf den Themenwerten Ihres Teams. Sie vergleicht die aktuellen Ergebnisse mit früheren Befragungen und relevanten Benchmarks, um wichtige Trends und auffällige Veränderungen im Zeitverlauf zu zeigen." },
    "It does not include open-text comments or any personally identifiable information.": { nl: "Ze bevat geen open antwoorden en geen persoonsgegevens.", de: "Sie enthält keine offenen Antworten und keine personenbezogenen Daten." },
    "About AI at Effectory": { nl: "Over AI bij Effectory", de: "Über KI bei Effectory" },
    "This insight is generated with AI to support interpretation and decision-making. It is designed to highlight patterns and signals, not to replace your own expertise or judgment. Effectory uses AI responsibly and in line with our privacy and security standards. No personally identifiable information is used, and customer data is not used to train AI models. All data remains stored in Europe under the same contractual and security terms as the rest of the platform. Learn more about how Effectory uses AI responsibly in our": { nl: "Dit inzicht is met AI gemaakt om je te helpen bij interpretatie en besluitvorming. Het legt patronen en signalen bloot en vervangt niet je eigen expertise of oordeel. Effectory gebruikt AI verantwoord en volgens onze privacy- en veiligheidsstandaarden. Er worden geen persoonsgegevens gebruikt en klantdata wordt niet gebruikt om AI-modellen te trainen. Alle data blijft in Europa opgeslagen, onder dezelfde contractuele en veiligheidsvoorwaarden als de rest van het platform. Lees meer over hoe Effectory AI verantwoord gebruikt in ons", de: "Diese Erkenntnis wurde mit KI erstellt, um Interpretation und Entscheidungen zu unterstützen. Sie zeigt Muster und Signale und ersetzt nicht Ihre eigene Expertise oder Ihr Urteil. Effectory nutzt KI verantwortungsvoll und im Einklang mit unseren Datenschutz- und Sicherheitsstandards. Es werden keine personenbezogenen Daten verwendet, und Kundendaten werden nicht zum Training von KI-Modellen genutzt. Alle Daten bleiben in Europa gespeichert, unter denselben vertraglichen und sicherheitsbezogenen Bedingungen wie der Rest der Plattform. Mehr dazu, wie Effectory KI verantwortungsvoll einsetzt, finden Sie in unserem" },

    "The position on the graph is defined by the scores below and how they relate to the benchmark. Focus on maintaining high scores and improving low scores.": { nl: "De positie in de grafiek wordt bepaald door de onderstaande scores en hoe deze zich verhouden tot de benchmark. Richt u op het behouden van hoge scores en het verbeteren van lage scores.", de: "Die Position im Diagramm ergibt sich aus den unten stehenden Werten und ihrem Verhältnis zur Benchmark. Konzentrieren Sie sich darauf, hohe Werte zu halten und niedrige Werte zu verbessern." },

    "The colors of the graph give you a visual indication of how effective the group is and what areas to focus on.": { nl: "De kleuren in de grafiek geven een visuele indicatie van hoe effectief de groep is en op welke gebieden je je kunt richten.", de: "Die Farben im Diagramm geben einen visuellen Hinweis darauf, wie effektiv die Gruppe ist und auf welche Bereiche man sich konzentrieren sollte." },

    "Engagement can unfold its full potential thanks to the excellent performance environment. Focus on maintaining and consolidating your strengths!": { nl: "Bevlogenheid kan haar volledige potentieel benutten dankzij de uitstekende werkomgeving. Richt u op het behouden en versterken van uw sterke punten!", de: "Engagement kann dank des hervorragenden Leistungsumfelds sein volles Potenzial entfalten. Konzentrieren Sie sich darauf, Ihre Stärken zu erhalten und zu festigen!" },
    "Focus on the continuous improvement of the performance environment, especially with issues of particular importance to engagement and performance.": { nl: "Richt u op de continue verbetering van de werkomgeving, vooral bij thema's die van groot belang zijn voor bevlogenheid en prestaties.", de: "Konzentrieren Sie sich auf die kontinuierliche Verbesserung des Leistungsumfelds, insbesondere bei Themen, die für Engagement und Leistung besonders wichtig sind." },
    "People are engaged but struggle to perform at their best. Improve their performance environment to make the group thrive.": { nl: "Mensen zijn bevlogen maar kunnen hun beste prestaties moeilijk leveren. Verbeter hun werkomgeving zodat de groep kan floreren.", de: "Die Menschen sind engagiert, können aber ihr volles Leistungspotenzial nur schwer ausschöpfen. Verbessern Sie ihr Leistungsumfeld, damit die Gruppe aufblüht." },
    "Maintain your good performance environment and review your drivers of employee engagement for opportunities to boost it.": { nl: "Behoud uw goede werkomgeving en bekijk de drijfveren van bevlogenheid om kansen te vinden om deze te vergroten.", de: "Erhalten Sie Ihr gutes Leistungsumfeld und überprüfen Sie die Treiber des Mitarbeiterengagements auf Möglichkeiten, es zu steigern." },

    /* ── Engagement side panel ── */
    "What does “Engagement” mean?": { nl: "Wat betekent “Bevlogenheid”?", de: "Was bedeutet „Engagement“?" },
    "Engagement is the degree to which your employees are inspired and energized by their work. It also refers to their positive connection to your organization. Engaged employees experience their work as meaningful and rewarding, are proud of their jobs, and feel that they fit in at the organization. They can go the extra mile because they love what they do and where they work. Your engagement score will tell you how enthusiastic your employees are about their work and how connected they feel to your organization.": { nl: "Bevlogenheid gaat over de mate waarin je medewerkers geïnspireerd raken door en energie krijgen van hun werk. Het heeft ook betrekking op hun positieve relatie met jouw organisatie. Bevlogen medewerkers ervaren hun werk als betekenisvol en dankbaar, zijn trots op hun baan en voelen zich binnen jouw organisatie op hun plek. Zij zullen zich extra inzetten voor je organisatie omdat ze hun werk en jouw organisatie zo leuk vinden. Je score op bevlogenheid vertelt jou hoe enthousiast je medewerkers zijn over hun werk en hoe betrokken ze zich voelen bij je organisatie.", de: "Engagement ist das Maß, in dem Ihre Mitarbeitenden durch ihre Arbeit inspiriert und voller Energie sind. Es bezieht sich auch auf ihre positive Verbindung zu Ihrer Organisation. Engagierte Mitarbeitende erleben ihre Arbeit als sinnvoll und bereichernd, sind stolz auf ihren Job und haben das Gefühl, in die Organisation zu passen. Sie gehen die Extrameile, weil sie lieben, was sie tun und wo sie arbeiten. Ihr Engagement-Wert zeigt, wie begeistert Ihre Mitarbeitenden von ihrer Arbeit sind und wie verbunden sie sich mit Ihrer Organisation fühlen." },
    "Engaged employees": { nl: "Bevlogen", de: "Engagierte Mitarbeitende" },
    "The percentage of participants that are Disengaged, Potentials or Engaged. Participants are categorized based on their average scores on Engagement.": { nl: "Het percentage deelnemers dat niet bevlogen, potentiëlen of bevlogen is. Deelnemers worden gecategoriseerd op basis van hun gemiddelde score op Bevlogenheid.", de: "Der Anteil der Teilnehmenden, die Nicht engagiert, Potenzial oder Engagiert sind. Die Teilnehmenden werden anhand ihrer durchschnittlichen Engagement-Werte eingeordnet." },

    "See how your group scored on “Engagement” in comparison to other groups.": { nl: "Bekijk hoe je groep heeft gescoord op Bevlogenheid vergeleken met andere groepen.", de: "Sehen Sie, wie Ihre Gruppe bei „Engagement“ im Vergleich zu anderen Gruppen abgeschnitten hat." },

    "I know what results are expected of me at work": { nl: "Ik weet welke resultaten er van mij op het werk worden verwacht", de: "Ich weiß, welche Ergebnisse bei der Arbeit von mir erwartet werden" },
