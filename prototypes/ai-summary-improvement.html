    /* Focus view — recommended actions (title + body) */
    "State trade-offs, not only tasks": { nl: "Benoem afwegingen, niet alleen taken", de: "Benennen Sie Abwägungen, nicht nur Aufgaben" },
    "At the start of each week or shift cycle, state what matters most and what can wait or be done lighter if pressure rises.": { nl: "Benoem aan het begin van elke week of dienstcyclus wat het belangrijkst is en wat kan wachten of lichter kan als de druk oploopt.", de: "Benennen Sie zu Beginn jeder Woche oder jedes Schichtzyklus, was am wichtigsten ist und was warten kann oder leichter erledigt werden darf, wenn der Druck steigt." },
    "Confirm one outcome expectation per person": { nl: "Bevestig per persoon één resultaatverwachting", de: "Bestätigen Sie pro Person eine Ergebniserwartung" },
    "In each 1:1, choose one important piece of work and ask what a good result looks like. Correct unclear expectations immediately.": { nl: "Kies in elk 1:1 één belangrijk stuk werk en vraag hoe een goed resultaat eruitziet. Corrigeer onduidelijke verwachtingen meteen.", de: "Wählen Sie in jedem 1:1 eine wichtige Aufgabe und fragen Sie, wie ein gutes Ergebnis aussieht. Korrigieren Sie unklare Erwartungen sofort." },
    "Run a weekly priority reset": { nl: "Houd een wekelijkse prioriteitenreset", de: "Führen Sie einen wöchentlichen Prioritäten-Reset durch" },
    "Run a weekly priority reset. Share the team's top three priorities and one piece of work that should receive less attention right now.": { nl: "Houd een wekelijkse prioriteitenreset. Deel de top drie prioriteiten van het team en één stuk werk dat nu minder aandacht zou moeten krijgen.", de: "Führen Sie einen wöchentlichen Prioritäten-Reset durch. Teilen Sie die drei wichtigsten Prioritäten des Teams und eine Aufgabe, die derzeit weniger Aufmerksamkeit erhalten sollte." },
    "Use definition-of-done for recurring ambiguous work": { nl: "Gebruik een definition of done voor terugkerend, onduidelijk werk", de: "Verwenden Sie eine Definition of Done für wiederkehrende, unklare Arbeit" },
    "Define the minimum standard for recurring ambiguous work before it starts: output, quality level, deadline, handover format, and exception rule.": { nl: "Bepaal voordat terugkerend, onduidelijk werk begint de minimumstandaard: output, kwaliteitsniveau, deadline, overdrachtsvorm en uitzonderingsregel.", de: "Legen Sie vor Beginn wiederkehrender, unklarer Arbeit den Mindeststandard fest: Output, Qualitätsniveau, Frist, Übergabeformat und Ausnahmeregel." },
    "Separate fixable friction from escalation issues": { nl: "Scheid oplosbare wrijving van escalatiekwesties", de: "Trennen Sie behebbare Reibung von Eskalationsthemen" },
    "Sort resource issues into three groups: you can fix, the team can work around, and needs escalation. Start with one issue you can fix this week.": { nl: "Verdeel knelpunten met werkmiddelen in drie groepen: zelf op te lossen, door het team te omzeilen, en moet geëscaleerd worden. Begin met één knelpunt dat je deze week kunt oplossen.", de: "Sortieren Sie Ressourcenprobleme in drei Gruppen: selbst lösbar, vom Team umgehbar und eskalationsbedürftig. Beginnen Sie mit einem Problem, das Sie diese Woche lösen können." },
    "Ask what resource gap slows this person's work most": { nl: "Vraag welk gebrek aan middelen het werk van deze persoon het meest vertraagt", de: "Fragen Sie, welche fehlende Ressource die Arbeit dieser Person am meisten verlangsamt" },
    "In each 1:1, ask which tool, material, permission, instruction, or workspace issue slows the person down most often. Capture a specific example.": { nl: "Vraag in elk 1:1 welk hulpmiddel, materiaal, welke toestemming, instructie of werkplekkwestie de persoon het vaakst vertraagt. Leg een concreet voorbeeld vast.", de: "Fragen Sie in jedem 1:1, welches Werkzeug, Material, welche Genehmigung, Anweisung oder welches Arbeitsplatzproblem die Person am häufigsten ausbremst. Halten Sie ein konkretes Beispiel fest." },
    "Build a resource friction log and close one item weekly": { nl: "Maak een logboek van knelpunten met middelen en sluit wekelijks één punt af", de: "Erstellen Sie ein Logbuch für Ressourcenprobleme und schließen Sie wöchentlich einen Punkt ab" },
    "Create a simple resource issue list and review it weekly with the team. Close at least one item you control each week.": { nl: "Maak een eenvoudige lijst met knelpunten en bespreek die wekelijks met het team. Sluit elke week minstens één punt af waar je invloed op hebt.", de: "Erstellen Sie eine einfache Liste mit Ressourcenproblemen und besprechen Sie sie wöchentlich mit dem Team. Schließen Sie jede Woche mindestens einen Punkt ab, auf den Sie Einfluss haben." },
    "Escalate repeated resource gaps with evidence": { nl: "Escaleer terugkerende tekorten aan middelen met bewijs", de: "Eskalieren Sie wiederkehrende Ressourcenlücken mit Belegen" },
    "Set a clear rule for when a resource issue must be escalated, such as repeated blockers, safety or quality risk, material time loss, customer impact, workaround cost, or unequal access. Escalate with facts: affected work, frequency, impact, current workaround, and support needed.": { nl: "Stel een duidelijke regel op voor wanneer een knelpunt geëscaleerd moet worden, zoals terugkerende blokkades, veiligheids- of kwaliteitsrisico's, aanzienlijk tijdverlies, impact op klanten, kosten van noodoplossingen of ongelijke toegang. Escaleer met feiten: getroffen werk, frequentie, impact, huidige noodoplossing en benodigde ondersteuning.", de: "Legen Sie eine klare Regel fest, wann ein Ressourcenproblem eskaliert werden muss, etwa bei wiederkehrenden Blockaden, Sicherheits- oder Qualitätsrisiken, erheblichem Zeitverlust, Auswirkungen auf Kund:innen, Kosten von Behelfslösungen oder ungleichem Zugang. Eskalieren Sie mit Fakten: betroffene Arbeit, Häufigkeit, Auswirkung, aktuelle Behelfslösung und benötigte Unterstützung." },
    "Check whether you are using people for availability instead of fit": { nl: "Ga na of je mensen inzet op beschikbaarheid in plaats van geschiktheid", de: "Prüfen Sie, ob Sie Menschen nach Verfügbarkeit statt nach Eignung einsetzen" },
    "Review recent assignments and spot where work went to whoever was available rather than whoever was best fitted or ready to grow. Adjust one upcoming assignment.": { nl: "Bekijk recente toewijzingen en spoor op waar werk ging naar wie beschikbaar was in plaats van wie het best geschikt was of klaar was om te groeien. Pas één komende toewijzing aan.", de: "Sehen Sie sich aktuelle Zuweisungen an und erkennen Sie, wo Arbeit an die verfügbare Person ging statt an die am besten geeignete oder entwicklungsbereite. Passen Sie eine anstehende Zuweisung an." },
    "Run a skills-to-work fit review": { nl: "Houd een review van de match tussen vaardigheden en werk", de: "Führen Sie eine Überprüfung der Passung von Fähigkeiten und Arbeit durch" },
    "Ask each person which parts of the role use their strengths, underuse them, or stretch them too far. Agree one practical adjustment or support step.": { nl: "Vraag elke persoon welke delen van de functie hun sterke kanten benutten, onderbenutten of te ver oprekken. Spreek één praktische aanpassing of ondersteuningsstap af.", de: "Fragen Sie jede Person, welche Teile der Rolle ihre Stärken nutzen, zu wenig nutzen oder zu stark fordern. Vereinbaren Sie eine praktische Anpassung oder Unterstützung." },
    "Map critical task coverage without exposing weaknesses": { nl: "Breng de dekking van cruciale taken in kaart zonder zwakke plekken bloot te leggen", de: "Kartieren Sie die Abdeckung kritischer Aufgaben, ohne Schwächen offenzulegen" },
    "Map recurring work against coverage: covered, workable with support, risky if only one person knows it, needs clearer standard, or needs training. Choose one pairing, cross-training, checklist, or backup action.": { nl: "Zet terugkerend werk af tegen de dekking: gedekt, werkbaar met ondersteuning, riskant als maar één persoon het kent, heeft een duidelijkere standaard nodig of training nodig. Kies één koppeling, cross-training, checklist of back-upactie.", de: "Ordnen Sie wiederkehrende Arbeit der Abdeckung zu: abgedeckt, mit Unterstützung machbar, riskant wenn nur eine Person es kann, braucht klareren Standard oder Schulung. Wählen Sie eine Paarung, Cross-Training, Checkliste oder Backup-Maßnahme." },
    "Create a support rule for new or difficult work": { nl: "Maak een ondersteuningsregel voor nieuw of moeilijk werk", de: "Erstellen Sie eine Unterstützungsregel für neue oder schwierige Arbeit" },
    "For new, difficult, or risky work, give five basics before assigning it: expected output, good example, check-in moment, support person, and fallback option.": { nl: "Geef bij nieuw, moeilijk of risicovol werk vijf basics mee voordat je het toewijst: verwachte output, een goed voorbeeld, een check-inmoment, een aanspreekpunt en een terugvaloptie.", de: "Geben Sie bei neuer, schwieriger oder riskanter Arbeit vor der Zuweisung fünf Grundlagen mit: erwarteter Output, gutes Beispiel, Check-in-Moment, Ansprechperson und Rückfalloption." },
    "Look for energy drains you may be causing": { nl: "Zoek naar energievreters die je mogelijk zelf veroorzaakt", de: "Suchen Sie nach Energiefressern, die Sie möglicherweise selbst verursachen" },
    "Check whether your routines create avoidable interruptions, unclear priorities, rework, last-minute pressure, or tension. Change one behaviour for the next two weeks.": { nl: "Ga na of jouw routines vermijdbare onderbrekingen, onduidelijke prioriteiten, overdoen van werk, last-minutedruk of spanning veroorzaken. Verander één gedrag voor de komende twee weken.", de: "Prüfen Sie, ob Ihre Routinen vermeidbare Unterbrechungen, unklare Prioritäten, Nacharbeit, Last-Minute-Druck oder Spannungen erzeugen. Ändern Sie ein Verhalten für die nächsten zwei Wochen." },
    "Map personal energisers and drainers": { nl: "Breng persoonlijke energiegevers en energievreters in kaart", de: "Kartieren Sie persönliche Energiequellen und Energiefresser" },
    "Ask each person what gives them energy and what drains more energy than it should. Agree one local fix for the draining item.": { nl: "Vraag elke persoon wat energie geeft en wat meer energie kost dan zou moeten. Spreek één lokale oplossing af voor het energievretende punt.", de: "Fragen Sie jede Person, was ihr Energie gibt und was mehr Energie kostet als nötig. Vereinbaren Sie eine lokale Lösung für den energiefressenden Punkt." },
    "Run an energy drain audit with a fixability filter": { nl: "Houd een audit van energievreters met een oplosbaarheidsfilter", de: "Führen Sie ein Audit der Energiefresser mit einem Behebbarkeitsfilter durch" },
    "Ask the team to list energy drains, rank them by frequency and fixability, and change one high-frequency drain for four weeks.": { nl: "Laat het team energievreters opsommen, rangschik ze op frequentie en oplosbaarheid, en verander vier weken lang één veelvoorkomende energievreter.", de: "Lassen Sie das Team Energiefresser auflisten, ordnen Sie sie nach Häufigkeit und Behebbarkeit und ändern Sie vier Wochen lang einen häufigen Energiefresser." },
    "Make repeated hidden work visible before reallocating it": { nl: "Maak terugkerend verborgen werk zichtbaar voordat je het herverdeelt", de: "Machen Sie wiederkehrende versteckte Arbeit sichtbar, bevor Sie sie neu verteilen" },
    "Track hidden work for two weeks, such as error fixing, informal coordination, handover clean-up, last-minute cover, admin recovery, customer follow-up, or emotional support after difficult incidents. Then rebalance one recurring task.": { nl: "Houd twee weken lang verborgen werk bij, zoals fouten herstellen, informeel afstemmen, overdrachten opruimen, last-minute invallen, administratie bijwerken, klantopvolging of emotionele steun na lastige incidenten. Herverdeel daarna één terugkerende taak.", de: "Erfassen Sie zwei Wochen lang versteckte Arbeit, etwa Fehlerbehebung, informelle Abstimmung, Aufräumen nach Übergaben, Last-Minute-Vertretung, Nacharbeit in der Verwaltung, Kundennachverfolgung oder emotionale Unterstützung nach schwierigen Vorfällen. Verteilen Sie danach eine wiederkehrende Aufgabe neu." },
    "Stop adding new unofficial channels": { nl: "Stop met het toevoegen van nieuwe onofficiële kanalen", de: "Hören Sie auf, neue inoffizielle Kanäle hinzuzufügen" },
    "For two weeks, stop adding new places for information. Put lasting updates in the official source and mark temporary updates clearly.": { nl: "Voeg twee weken lang geen nieuwe plekken voor informatie toe. Zet blijvende updates in de officiële bron en markeer tijdelijke updates duidelijk.", de: "Fügen Sie zwei Wochen lang keine neuen Orte für Informationen hinzu. Stellen Sie dauerhafte Updates in die offizielle Quelle und kennzeichnen Sie temporäre Updates deutlich." },
    "Ask each person where they lose information": { nl: "Vraag elke persoon waar informatie verloren gaat", de: "Fragen Sie jede Person, wo Informationen verloren gehen" },
    "In 1:1s, ask where the person gets stuck when looking for information. Identify whether the issue is location, access, ownership, wording, timing, or version control, then fix one concrete issue.": { nl: "Vraag in 1:1's waar de persoon vastloopt bij het zoeken naar informatie. Bepaal of het gaat om vindplaats, toegang, eigenaarschap, formulering, timing of versiebeheer, en los daarna één concreet probleem op.", de: "Fragen Sie in 1:1s, wo die Person beim Suchen nach Informationen hängen bleibt. Bestimmen Sie, ob es um Ablageort, Zugang, Verantwortlichkeit, Formulierung, Timing oder Versionsverwaltung geht, und beheben Sie dann ein konkretes Problem." },
    "End team updates with 'what changed, where it lives'": { nl: "Sluit teamupdates af met 'wat is veranderd, waar staat het'", de: "Beenden Sie Team-Updates mit 'was sich geändert hat, wo es zu finden ist'" },
    "End each meeting, huddle, or shift briefing by saying what changed, who is affected, what action is needed, and where the latest information lives.": { nl: "Sluit elke vergadering, korte stand-up of dienstbriefing af door te benoemen wat er is veranderd, wie het raakt, welke actie nodig is en waar de laatste informatie staat.", de: "Beenden Sie jede Besprechung, jedes Kurzmeeting oder jede Schichtübergabe mit der Angabe, was sich geändert hat, wer betroffen ist, welche Maßnahme nötig ist und wo die aktuellen Informationen zu finden sind." },
    "Create a five-item source-of-truth map": { nl: "Maak een source-of-truth-overzicht met vijf items", de: "Erstellen Sie eine Source-of-Truth-Übersicht mit fünf Einträgen" },
    "Pick the five information types the team uses most and name the official location, owner, update rhythm, and duplicate source to stop using.": { nl: "Kies de vijf informatiesoorten die het team het meest gebruikt en benoem de officiële vindplaats, de eigenaar, het updateritme en de dubbele bron die je niet meer moet gebruiken.", de: "Wählen Sie die fünf Informationsarten, die das Team am meisten nutzt, und benennen Sie den offiziellen Ablageort, die verantwortliche Person, den Aktualisierungsrhythmus und die doppelte Quelle, die nicht mehr genutzt werden soll." },
    "Remove one manager-created boundary leak": { nl: "Verwijder één door de manager veroorzaakt grenslek", de: "Beseitigen Sie ein von der Führungskraft verursachtes Grenzleck" },
    "Review where your own behaviour weakens recovery, such as after-hours messages, last-minute requests, unclear urgency, praise for constant availability, or cancelled breaks. Remove one boundary leak this week.": { nl: "Bekijk waar jouw eigen gedrag herstel ondermijnt, zoals berichten buiten werktijd, last-minuteverzoeken, onduidelijke urgentie, lof voor constante bereikbaarheid of geschrapte pauzes. Verwijder deze week één grenslek.", de: "Prüfen Sie, wo Ihr eigenes Verhalten die Erholung schwächt, etwa Nachrichten außerhalb der Arbeitszeit, Last-Minute-Anfragen, unklare Dringlichkeit, Lob für ständige Erreichbarkeit oder gestrichene Pausen. Beseitigen Sie diese Woche ein Grenzleck." },
    "Ask what is pushing work into recovery time": { nl: "Vraag wat werk in de hersteltijd duwt", de: "Fragen Sie, was Arbeit in die Erholungszeit drängt" },
    "In 1:1s, ask what work most often spills into breaks, evenings, weekends, or recovery time. Identify whether the cause is volume, staffing, handover, unclear priority, or personal habit, then agree one immediate protection.": { nl: "Vraag in 1:1's welk werk het vaakst doorloopt in pauzes, avonden, weekenden of hersteltijd. Bepaal of de oorzaak ligt in volume, bezetting, overdracht, onduidelijke prioriteit of een persoonlijke gewoonte, en spreek daarna één directe bescherming af.", de: "Fragen Sie in 1:1s, welche Arbeit am häufigsten in Pausen, Abende, Wochenenden oder die Erholungszeit überläuft. Bestimmen Sie, ob die Ursache Menge, Besetzung, Übergabe, unklare Priorität oder eine persönliche Gewohnheit ist, und vereinbaren Sie dann einen sofortigen Schutz." },
    "Use a workload trade-off rule in planning": { nl: "Gebruik een werkdruk-afwegingsregel in de planning", de: "Verwenden Sie eine Abwägungsregel zur Arbeitsbelastung in der Planung" },
    "When new work is added, ask what will stop, move, or become lighter. Use the answer to protect people from hidden overload.": { nl: "Vraag bij nieuw werk wat stopt, verschuift of lichter wordt. Gebruik het antwoord om mensen te beschermen tegen verborgen overbelasting.", de: "Fragen Sie bei neuer Arbeit, was aufhört, verschoben wird oder leichter wird. Nutzen Sie die Antwort, um Menschen vor versteckter Überlastung zu schützen." },
    "Add recovery and workload limits to planning": { nl: "Voeg herstel- en werkdruklimieten toe aan de planning", de: "Fügen Sie der Planung Erholungs- und Arbeitsbelastungsgrenzen hinzu" },
    "Add a workload and recovery check to planning. Define peak periods, work to pause, cover needed, escalation triggers, and recovery time.": { nl: "Voeg een werkdruk- en herstelcheck toe aan de planning. Bepaal piekperioden, werk dat gepauzeerd kan worden, benodigde vervanging, escalatietriggers en hersteltijd.", de: "Fügen Sie der Planung eine Prüfung von Arbeitsbelastung und Erholung hinzu. Definieren Sie Spitzenzeiten, pausierbare Arbeit, benötigte Vertretung, Eskalationsauslöser und Erholungszeit." },
    "Notice which tasks you protect or postpone": { nl: "Merk op welke taken je beschermt of uitstelt", de: "Beachten Sie, welche Aufgaben Sie schützen oder aufschieben" },
    "For one week, track which recurring tasks you protect, delay, delegate last, or complain about. Use the pattern to adjust one draining task in the next planning cycle.": { nl: "Houd een week lang bij welke terugkerende taken je beschermt, uitstelt, als laatste delegeert of waarover je klaagt. Gebruik het patroon om in de volgende planningscyclus één energievretende taak aan te passen.", de: "Verfolgen Sie eine Woche lang, welche wiederkehrenden Aufgaben Sie schützen, verzögern, zuletzt delegieren oder über die Sie sich beklagen. Nutzen Sie das Muster, um im nächsten Planungszyklus eine zehrende Aufgabe anzupassen." },
    "Run a task enjoyment map in 1:1s": { nl: "Maak een plezierkaart van taken in 1:1's", de: "Erstellen Sie eine Aufgaben-Freude-Karte in 1:1s" },
    "In your next 1:1s, ask each person which recurring tasks energise them, feel neutral, or drain them. Agree one small adjustment for the next four weeks.": { nl: "Vraag in je volgende 1:1's elke persoon welke terugkerende taken energie geven, neutraal voelen of energie kosten. Spreek één kleine aanpassing af voor de komende vier weken.", de: "Fragen Sie in Ihren nächsten 1:1s jede Person, welche wiederkehrenden Aufgaben Energie geben, neutral wirken oder zehren. Vereinbaren Sie eine kleine Anpassung für die nächsten vier Wochen." },
    "Rotate or pair the least-liked recurring work": { nl: "Wissel het minst geliefde terugkerende werk af of voer het samen uit", de: "Wechseln Sie die unbeliebteste wiederkehrende Arbeit ab oder erledigen Sie sie zu zweit" },
    "Pick one recurring task the team dislikes and test a better setup for one month: rotate it, pair people, batch it, or add a checklist.": { nl: "Kies één terugkerende taak die het team vervelend vindt en test een maand lang een betere opzet: wissel hem af, laat mensen samenwerken, bundel hem of voeg een checklist toe.", de: "Wählen Sie eine wiederkehrende Aufgabe, die das Team ungern macht, und testen Sie einen Monat lang eine bessere Lösung: abwechseln, zu zweit erledigen, bündeln oder eine Checkliste hinzufügen." },
    "Remove or simplify one low-value recurring task": { nl: "Verwijder of vereenvoudig één terugkerende taak met weinig waarde", de: "Entfernen oder vereinfachen Sie eine wiederkehrende Aufgabe mit geringem Wert" },
    "Review recurring meetings, reports, approvals, checks, and handovers. Remove or simplify one that no longer improves decisions, quality, or service.": { nl: "Bekijk terugkerende vergaderingen, rapporten, goedkeuringen, controles en overdrachten. Verwijder of vereenvoudig er één die beslissingen, kwaliteit of service niet meer verbetert.", de: "Sehen Sie sich wiederkehrende Besprechungen, Berichte, Freigaben, Kontrollen und Übergaben an. Entfernen oder vereinfachen Sie eine, die Entscheidungen, Qualität oder Service nicht mehr verbessert." },
    "Team action": { nl: "Teamactie", de: "Teammaßnahme" },
    "1:1 action": { nl: "1-op-1-actie", de: "1:1-Maßnahme" },
    "Process change": { nl: "Procesverandering", de: "Prozessänderung" },
    "Personal action": { nl: "Persoonlijke actie", de: "Persönliche Maßnahme" },
    "Create new action": { nl: "Nieuwe actie maken", de: "Neue Maßnahme erstellen" },
    "Add to action planner": { nl: "Toevoegen aan actieplanner", de: "Zum Maßnahmenplaner hinzufügen" },
    "Got it": { nl: "Begrepen", de: "Verstanden" },
    "Focus areas are identified based on four factors from your team's survey results:": { nl: "Aandachtsgebieden worden bepaald op basis van vier factoren uit de onderzoeksresultaten van je team:", de: "Schwerpunkte werden anhand von vier Faktoren aus den Umfrageergebnissen Ihres Teams ermittelt:" },
    "Successes are identified based on the same four factors from your team's survey results:": { nl: "Successen worden bepaald op basis van dezelfde vier factoren uit de onderzoeksresultaten van je team:", de: "Erfolge werden anhand derselben vier Faktoren aus den Umfrageergebnissen Ihres Teams ermittelt:" },
    "Trend - whether your team's score on this question has declined since the last survey": { nl: "Trend – of de score van je team op deze vraag is gedaald sinds het vorige onderzoek", de: "Trend – ob der Wert Ihres Teams bei dieser Frage seit der letzten Befragung gesunken ist" },
    "Trend - whether your team's score on this question has improved since the last survey": { nl: "Trend – of de score van je team op deze vraag is verbeterd sinds het vorige onderzoek", de: "Trend – ob sich der Wert Ihres Teams bei dieser Frage seit der letzten Befragung verbessert hat" },
    "Gap - how your team's score compares to the rest of the organisation": { nl: "Gap – hoe de score van je team zich verhoudt tot de rest van de organisatie", de: "Gap – wie der Wert Ihres Teams im Vergleich zur übrigen Organisation ausfällt" },
    "Consistency - how aligned your team members are in their responses": { nl: "Consistentie – hoe eensgezind je teamleden zijn in hun antwoorden", de: "Konsistenz – wie einheitlich Ihre Teammitglieder in ihren Antworten sind" },
    "Performance - how your score compares to internal and external benchmarks": { nl: "Prestatie – hoe je score zich verhoudt tot interne en externe benchmarks", de: "Leistung – wie Ihr Wert im Vergleich zu internen und externen Benchmarks ausfällt" },
    "Questions that score highest across these four factors are surfaced as your top focus areas.": { nl: "Vragen die op deze vier factoren het hoogst scoren, worden getoond als je belangrijkste aandachtsgebieden.", de: "Fragen, die über diese vier Faktoren am höchsten abschneiden, werden als Ihre wichtigsten Schwerpunkte angezeigt." },
    "Questions that score best across these four factors are surfaced as your top successes.": { nl: "Vragen die op deze vier factoren het best scoren, worden getoond als je grootste successen.", de: "Fragen, die über diese vier Faktoren am besten abschneiden, werden als Ihre größten Erfolge angezeigt." },
    "Team session": { nl: "Teamsessie", de: "Teamsitzung" },
    "1:1 conversation": { nl: "1-op-1-gesprek", de: "1:1-Gespräch" },
    "Low effort": { nl: "Weinig inspanning", de: "Geringer Aufwand" },
    "Medium effort": { nl: "Gemiddelde inspanning", de: "Mittlerer Aufwand" },
    "High effort": { nl: "Veel inspanning", de: "Hoher Aufwand" },
    "Run a short team session on this theme": { nl: "Houd een korte teamsessie over dit thema", de: "Führen Sie eine kurze Teamsitzung zu diesem Thema durch" },
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Bring the team together to name what gets in the way, then agree on one concrete change to try over the next few weeks.": { nl: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Breng het team samen om te benoemen wat in de weg zit en spreek vervolgens één concrete verandering af om de komende weken uit te proberen.", de: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Bringen Sie das Team zusammen, um zu benennen, was im Weg steht, und vereinbaren Sie dann eine konkrete Änderung, die Sie in den nächsten Wochen ausprobieren." },
    "Ask each person where their strengths are underused": { nl: "Vraag elke medewerker waar hun sterke punten onderbenut blijven", de: "Fragen Sie jede Person, wo ihre Stärken zu wenig genutzt werden" },
    "Your team signalled their skills do not fully fit their roles. In your next 1:1s, ask what each person does best and where they feel stretched too thin — or not enough. Small adjustments to who owns what can close the fit gap surprisingly quickly.": { nl: "Je team gaf aan dat hun vaardigheden niet volledig aansluiten op hun rol. Vraag in je volgende 1-op-1-gesprekken waar iemand het best in is en waar diegene zich te dun uitgesmeerd voelt — of juist te weinig wordt uitgedaagd. Kleine aanpassingen in wie wat doet kunnen het verschil verrassend snel dichten.", de: "Ihr Team hat signalisiert, dass seine Fähigkeiten nicht ganz zu den Rollen passen. Fragen Sie in Ihren nächsten 1:1-Gesprächen, was jede Person am besten kann und wo sie sich zu dünn aufgestellt fühlt — oder zu wenig gefordert. Kleine Anpassungen, wer was übernimmt, können die Lücke überraschend schnell schließen." },
    "Adjust how work flows through the team": { nl: "Pas aan hoe het werk door het team stroomt", de: "Passen Sie an, wie die Arbeit durch das Team fließt" },
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Review the current workflow and remove the step that adds the least value.": { nl: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Bekijk de huidige workflow en verwijder de stap die de minste waarde toevoegt.", de: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Überprüfen Sie den aktuellen Workflow und entfernen Sie den Schritt, der den geringsten Mehrwert bietet." },
    "Reflect on your own role in this theme": { nl: "Reflecteer op je eigen rol in dit thema", de: "Reflektieren Sie über Ihre eigene Rolle bei diesem Thema" },
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Take a moment to consider one small thing you can change in how you support the team this week.": { nl: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sta even stil bij één kleine verandering die je deze week kunt doorvoeren in hoe je het team ondersteunt.", de: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Überlegen Sie kurz, welche kleine Sache Sie diese Woche daran ändern können, wie Sie das Team unterstützen." },

    /* ── Themes radar axis labels ── */
    "Diversity": { nl: "Diversiteit", de: "Diversität" },
    "Employer-ship": { nl: "Werkgeverschap", de: "Arbeitgeberattraktivität" },
    "Customer focus": { nl: "Klantgerichtheid", de: "Kundenorientierung" },
    "Alignment": { nl: "Afstemming", de: "Ausrichtung" },
    "Leadership": { nl: "Leiderschap", de: "Führung" },

    /* ── Per-variant narrative copy (team-it-before) ── */
    "The IT team’s results indicate several challenges impacting overall effectiveness and employee experience. Engagement (56%) and retention (57%) are below desired levels, suggesting employees may feel disconnected from the organization and uncertain about their long-term future within the team. Workload scores are particularly low at 38%, highlighting concerns around capacity, prioritization, and sustainable ways of working. While the eNPS score of 12 remains positive, it indicates only moderate advocacy and suggests there is significant room for improvement in employee satisfaction and loyalty.": { nl: "De resultaten van het IT team wijzen op verschillende uitdagingen die de algehele effectiviteit en medewerkerservaring beïnvloeden. Bevlogenheid (56%) en behoud (57%) liggen onder het gewenste niveau, wat erop kan duiden dat medewerkers zich minder verbonden voelen met de organisatie en onzeker zijn over hun toekomst op lange termijn binnen het team. De werkdrukscores zijn met 38% bijzonder laag en leggen zorgen bloot rond capaciteit, prioritering en duurzame manieren van werken. Hoewel de eNPS-score van 12 positief blijft, wijst deze slechts op gematigde aanbeveling en laat zien dat er aanzienlijke ruimte is voor verbetering van de tevredenheid en loyaliteit van medewerkers.", de: "Die Ergebnisse des IT teams weisen auf mehrere Herausforderungen hin, die sich auf die Gesamteffektivität und die Mitarbeitererfahrung auswirken. Engagement (56%) und Mitarbeiterbindung (57%) liegen unter dem gewünschten Niveau, was darauf hindeutet, dass sich Mitarbeitende möglicherweise von der Organisation abgekoppelt fühlen und hinsichtlich ihrer langfristigen Zukunft im Team unsicher sind. Die Werte zur Arbeitsbelastung sind mit 38% besonders niedrig und verdeutlichen Bedenken in Bezug auf Kapazität, Priorisierung und nachhaltige Arbeitsweisen. Der eNPS-Wert von 12 bleibt zwar positiv, deutet jedoch nur auf eine mäßige Weiterempfehlung hin und zeigt, dass erhebliches Verbesserungspotenzial bei Zufriedenheit und Loyalität der Mitarbeitenden besteht." },
    "As the team falls within the ineffective quadrant, focused action is required to address workload pressures, strengthen leadership support, and improve employee engagement. Creating greater clarity around priorities, improving resource allocation, and increasing opportunities for employee feedback may help rebuild trust and team effectiveness.": { nl: "Omdat het team in het ineffectieve kwadrant valt, is gerichte actie nodig om de werkdruk aan te pakken, de ondersteuning vanuit het leiderschap te versterken en de bevlogenheid van medewerkers te vergroten. Meer duidelijkheid scheppen rond prioriteiten, de inzet van middelen verbeteren en meer ruimte bieden voor feedback van medewerkers kan helpen om het vertrouwen en de effectiviteit van het team te herstellen.", de: "Da das Team in den ineffektiven Quadranten fällt, sind gezielte Maßnahmen erforderlich, um die Arbeitsbelastung zu verringern, die Unterstützung durch die Führung zu stärken und das Engagement der Mitarbeitenden zu verbessern. Mehr Klarheit bei den Prioritäten zu schaffen, die Ressourcenverteilung zu verbessern und mehr Möglichkeiten für Mitarbeiterfeedback zu schaffen, kann dazu beitragen, Vertrauen und Teameffektivität wiederherzustellen." },
    "eNPS remains positive at 12, indicating that a portion of employees are still willing to recommend the organization as a place to work.": { nl: "De eNPS blijft met 12 positief, wat aangeeft dat een deel van de medewerkers de organisatie nog steeds als werkgever zou aanbevelen.", de: "Der eNPS bleibt mit 12 positiv, was darauf hindeutet, dass ein Teil der Mitarbeitenden die Organisation nach wie vor als Arbeitgeber weiterempfehlen würde." },
    "Retention sentiment (57%) suggests that more than half of employees currently see themselves remaining with the organization.": { nl: "Het sentiment rond behoud (57%) suggereert dat meer dan de helft van de medewerkers zichzelf op dit moment bij de organisatie ziet blijven.", de: "Die Stimmung zur Mitarbeiterbindung (57%) deutet darauf hin, dass sich derzeit mehr als die Hälfte der Mitarbeitenden einen Verbleib in der Organisation vorstellen kann." },
    "Workload (38%) is significantly below desired levels and appears to be a key driver of employee dissatisfaction.": { nl: "Werkdruk (38%) ligt aanzienlijk onder het gewenste niveau en lijkt een belangrijke oorzaak te zijn van ontevredenheid onder medewerkers.", de: "Die Arbeitsbelastung (38%) liegt deutlich unter dem gewünschten Niveau und scheint ein wesentlicher Treiber für die Unzufriedenheit der Mitarbeitenden zu sein." },
    "Engagement (56%) indicates employees may not feel fully connected to team goals or motivated by their current work environment.": { nl: "Bevlogenheid (56%) geeft aan dat medewerkers zich mogelijk niet volledig verbonden voelen met de teamdoelen of niet gemotiveerd worden door hun huidige werkomgeving.", de: "Engagement (56%) deutet darauf hin, dass sich Mitarbeitende möglicherweise nicht vollständig mit den Teamzielen verbunden fühlen oder von ihrem aktuellen Arbeitsumfeld nicht motiviert werden." },
    "Retention (57%) presents a potential risk for future turnover if underlying concerns are not addressed.": { nl: "Behoud (57%) vormt een mogelijk risico op toekomstig verloop als de onderliggende zorgen niet worden aangepakt.", de: "Mitarbeiterbindung (57%) stellt ein potenzielles Risiko für künftige Fluktuation dar, wenn die zugrunde liegenden Bedenken nicht angegangen werden." },
    "Review team capacity, workload distribution, and project prioritization to reduce pressure on employees.": { nl: "Beoordeel de teamcapaciteit, de verdeling van de werkdruk en de prioritering van projecten om de druk op medewerkers te verlagen.", de: "Überprüfen Sie die Teamkapazität, die Verteilung der Arbeitsbelastung und die Priorisierung von Projekten, um den Druck auf die Mitarbeitenden zu verringern." },
    "Conduct listening sessions to better understand the factors contributing to lower engagement and retention.": { nl: "Organiseer luistersessies om de factoren die bijdragen aan lagere bevlogenheid en behoud beter te begrijpen.", de: "Führen Sie Zuhör-Sessions durch, um die Faktoren besser zu verstehen, die zu geringerem Engagement und geringerer Mitarbeiterbindung beitragen." },
    "Increase transparency around team objectives, decision-making, and career development opportunities.": { nl: "Vergroot de transparantie rond teamdoelstellingen, besluitvorming en mogelijkheden voor loopbaanontwikkeling.", de: "Erhöhen Sie die Transparenz in Bezug auf Teamziele, Entscheidungsfindung und Möglichkeiten zur Karriereentwicklung." },
    "Equip managers with tools and training to support employee wellbeing, recognition, and performance conversations.": { nl: "Voorzie managers van tools en training om het welzijn van medewerkers, waardering en gesprekken over prestaties te ondersteunen.", de: "Statten Sie Führungskräfte mit Werkzeugen und Schulungen aus, um das Wohlbefinden der Mitarbeitenden, Anerkennung und Leistungsgespräche zu unterstützen." },
    "Develop a targeted action plan with measurable milestones to improve team effectiveness over the next survey cycle.": { nl: "Ontwikkel een gericht actieplan met meetbare mijlpalen om de effectiviteit van het team in de volgende onderzoekscyclus te verbeteren.", de: "Entwickeln Sie einen gezielten Aktionsplan mit messbaren Meilensteinen, um die Teameffektivität im nächsten Befragungszyklus zu verbessern." },
    "Both engagement and the performance environment are under pressure. Without attention, this can affect results and team wellbeing over time.": { nl: "Zowel de bevlogenheid als de werkomgeving staan onder druk. Zonder aandacht kan dit op termijn de resultaten en het welzijn van het team beïnvloeden.", de: "Sowohl das Engagement als auch das Leistungsumfeld stehen unter Druck. Ohne entsprechende Aufmerksamkeit kann sich dies mit der Zeit auf die Ergebnisse und das Wohlbefinden des Teams auswirken." },
    "In this situation, it is important to slow down and create focus. A structured and supported follow-up helps bring stability and direction. Rather than trying to fix everything, concentrate on the few areas that are most urgent and within your influence.": { nl: "In deze situatie is het belangrijk om gas terug te nemen en focus aan te brengen. Een gestructureerde en goed ondersteunde opvolging helpt om stabiliteit en richting te brengen. In plaats van alles tegelijk te willen oplossen, richt u zich op de paar gebieden die het meest urgent zijn en binnen uw invloed liggen.", de: "In dieser Situation ist es wichtig, das Tempo zu drosseln und Fokus zu schaffen. Eine strukturierte und begleitete Nachverfolgung hilft, Stabilität und Orientierung zu geben. Anstatt zu versuchen, alles auf einmal zu lösen, konzentrieren Sie sich auf die wenigen Bereiche, die am dringendsten sind und in Ihrem Einflussbereich liegen." },
    "Prepare &amp; reflect:": { nl: "Voorbereiden &amp; reflecteren:", de: "Vorbereiten &amp; reflektieren:" },
    "Take time to understand the results and, if helpful, seek support before moving into team discussions.": { nl: "Neem de tijd om de resultaten te begrijpen en zoek, indien dat helpt, ondersteuning voordat u het gesprek met het team aangaat.", de: "Nehmen Sie sich Zeit, um die Ergebnisse zu verstehen, und holen Sie sich bei Bedarf Unterstützung, bevor Sie in die Teamgespräche einsteigen." },
    "Review &amp; prioritize:": { nl: "Beoordelen &amp; prioriteren:", de: "Überprüfen &amp; priorisieren:" },
    "Group feedback by urgency (critical, high risk, improvement) and select the few priorities that matter most.": { nl: "Groepeer feedback op urgentie (kritiek, hoog risico, verbetering) en selecteer de paar prioriteiten die er het meest toe doen.", de: "Gruppieren Sie das Feedback nach Dringlichkeit (kritisch, hohes Risiko, Verbesserung) und wählen Sie die wenigen Prioritäten aus, die am wichtigsten sind." },
    "Discuss &amp; align:": { nl: "Bespreken &amp; afstemmen:", de: "Besprechen &amp; abstimmen:" },
    "Share findings transparently with the team and agree on clear priorities together.": { nl: "Deel de bevindingen transparant met het team en spreek samen duidelijke prioriteiten af.", de: "Teilen Sie die Erkenntnisse transparent mit dem Team und legen Sie gemeinsam klare Prioritäten fest." },
    "Implement &amp; monitor:": { nl: "Uitvoeren &amp; monitoren:", de: "Umsetzen &amp; überwachen:" },
    "Assign clear ownership, ensure appropriate support is in place, and establish a tight cadence to track progress and adjust where needed.": { nl: "Wijs duidelijke verantwoordelijkheid toe, zorg dat passende ondersteuning aanwezig is en hanteer een strak ritme om de voortgang te volgen en waar nodig bij te sturen.", de: "Legen Sie klare Verantwortlichkeiten fest, sorgen Sie für angemessene Unterstützung und etablieren Sie einen engen Rhythmus, um den Fortschritt zu verfolgen und bei Bedarf anzupassen." },
    "Clear priorities, visible action and consistent follow-up help rebuild trust and restore momentum step by step.": { nl: "Duidelijke prioriteiten, zichtbare actie en consistente opvolging helpen om het vertrouwen te herstellen en stap voor stap weer momentum op te bouwen.", de: "Klare Prioritäten, sichtbares Handeln und eine konsequente Nachverfolgung helfen, Vertrauen wiederaufzubauen und Schritt für Schritt neue Dynamik zu gewinnen." },

    /* ── Per-variant narrative copy (team-it-after) ── */
    "The IT team's latest survey results show a significant improvement across key engagement and employee experience indicators. Engagement has increased to 67%, while retention has risen to 73%, indicating that employees are more committed to both their current role and the organization. The team also achieved an eNPS of 31, reflecting a strong increase in employee advocacy and a greater willingness to recommend the organization as a place to work.": { nl: "De recentste onderzoeksresultaten van het IT team laten een aanzienlijke verbetering zien op belangrijke indicatoren voor bevlogenheid en medewerkerservaring. De bevlogenheid is gestegen naar 67%, terwijl het behoud is toegenomen tot 73%. Dit laat zien dat medewerkers meer toegewijd zijn aan zowel hun huidige functie als de organisatie. Het team behaalde daarnaast een eNPS van 31, wat duidt op een sterke toename in ambassadeurschap en een grotere bereidheid om de organisatie aan te bevelen als werkgever.", de: "Die aktuellsten Umfrageergebnisse des IT teams zeigen eine deutliche Verbesserung bei wichtigen Kennzahlen für Engagement und Mitarbeitererfahrung. Das Engagement ist auf 67% gestiegen, während die Mitarbeiterbindung auf 73% zugenommen hat. Das deutet darauf hin, dass die Mitarbeitenden sich sowohl ihrer aktuellen Rolle als auch der Organisation stärker verbunden fühlen. Das Team erreichte zudem einen eNPS von 31, was einen starken Anstieg des Mitarbeiter-Engagements und eine größere Bereitschaft widerspiegelt, die Organisation als Arbeitgeber weiterzuempfehlen." },
    "Workload perceptions have improved considerably, with 56% of employees reporting that their workload feels “just right.” Combined with a strong response rate of 79%, these results provide a reliable view of employee sentiment and suggest that recent actions have positively impacted the employee experience.": { nl: "De beleving van de werkdruk is aanzienlijk verbeterd: 56% van de medewerkers geeft aan dat hun werkdruk “precies goed” aanvoelt. In combinatie met een sterk responspercentage van 79% bieden deze resultaten een betrouwbaar beeld van hoe medewerkers zich voelen, en suggereren ze dat recente acties een positief effect hebben gehad op de medewerkerservaring.", de: "Die Wahrnehmung der Arbeitsbelastung hat sich erheblich verbessert: 56% der Mitarbeitenden geben an, dass sich ihre Arbeitsbelastung „genau richtig“ anfühlt. In Kombination mit einer starken Rücklaufquote von 79% bieten diese Ergebnisse ein verlässliches Bild der Mitarbeiterstimmung und legen nahe, dass die jüngsten Maßnahmen sich positiv auf die Mitarbeitererfahrung ausgewirkt haben." },
    "As a result of these improvements, the IT team has moved into the effective quadrant, demonstrating stronger organizational health, improved employee engagement, and a more sustainable work environment. Continued focus on employee development, recognition, and workload management will help maintain this positive momentum.": { nl: "Dankzij deze verbeteringen is het IT team in het effectieve kwadrant terechtgekomen, wat wijst op een sterkere organisatiegezondheid, een hogere bevlogenheid en een duurzamere werkomgeving. Door te blijven inzetten op ontwikkeling, erkenning en het beheersen van de werkdruk blijft dit positieve momentum behouden.", de: "Dank dieser Verbesserungen ist das IT team in den effektiven Quadranten aufgestiegen, was eine stärkere organisatorische Gesundheit, ein höheres Engagement und ein nachhaltigeres Arbeitsumfeld belegt. Ein anhaltender Fokus auf Mitarbeiterentwicklung, Anerkennung und Steuerung der Arbeitsbelastung hilft, dieses positive Momentum aufrechtzuerhalten." },
    "Engagement (67%) has increased, indicating stronger commitment, motivation, and connection to team objectives.": { nl: "De bevlogenheid (67%) is gestegen, wat duidt op een sterkere toewijding, motivatie en verbondenheid met de teamdoelen.", de: "Das Engagement (67%) ist gestiegen, was auf eine stärkere Verbundenheit, Motivation und Verbindung zu den Teamzielen hindeutet." },
    "Retention (73%) shows that a large majority of employees intend to remain in their current role.": { nl: "Het behoud (73%) laat zien dat een grote meerderheid van de medewerkers van plan is in hun huidige functie te blijven.", de: "Die Mitarbeiterbindung (73%) zeigt, dass eine große Mehrheit der Mitarbeitenden in ihrer aktuellen Rolle bleiben möchte." },
    "eNPS (31) reflects a healthy level of employee advocacy and confidence in the organization.": { nl: "De eNPS (31) weerspiegelt een gezond niveau van ambassadeurschap en vertrouwen in de organisatie.", de: "Der eNPS (31) spiegelt ein gesundes Maß an Mitarbeiter-Engagement und Vertrauen in die Organisation wider." },
    "Workload perceptions have improved, with 56% of employees reporting that their workload is appropriately balanced.": { nl: "De beleving van de werkdruk is verbeterd: 56% van de medewerkers geeft aan dat hun werkdruk goed in balans is.", de: "Die Wahrnehmung der Arbeitsbelastung hat sich verbessert: 56% der Mitarbeitenden geben an, dass ihre Arbeitsbelastung gut ausgewogen ist." },
    "A response rate of 79% provides strong confidence in the reliability and representativeness of the survey results.": { nl: "Een responspercentage van 79% geeft veel vertrouwen in de betrouwbaarheid en representativiteit van de onderzoeksresultaten.", de: "Eine Rücklaufquote von 79% schafft großes Vertrauen in die Zuverlässigkeit und Repräsentativität der Umfrageergebnisse." },
    "While workload perceptions have improved, nearly half of employees still do not view their workload as optimal, presenting an opportunity for further refinement of prioritization and resource planning.": { nl: "Hoewel de beleving van de werkdruk is verbeterd, ervaart bijna de helft van de medewerkers hun werkdruk nog steeds niet als optimaal. Dit biedt een kans om de prioritering en personeelsplanning verder aan te scherpen.", de: "Obwohl sich die Wahrnehmung der Arbeitsbelastung verbessert hat, empfindet fast die Hälfte der Mitarbeitenden ihre Arbeitsbelastung noch nicht als optimal. Das bietet die Gelegenheit, Priorisierung und Ressourcenplanung weiter zu verfeinern." },
    "Engagement is trending positively but remains below top-performing team benchmarks, suggesting opportunities to further strengthen employee involvement and recognition.": { nl: "De bevlogenheid laat een positieve trend zien, maar blijft onder de benchmark van best presterende teams. Dit wijst op kansen om de bevlogenheid en erkenning van medewerkers verder te versterken.", de: "Das Engagement zeigt einen positiven Trend, liegt aber weiterhin unter der Benchmark der leistungsstärksten Teams. Das deutet auf Möglichkeiten hin, die Einbindung und Anerkennung der Mitarbeitenden weiter zu stärken." },
    "Continue monitoring workload distribution and team capacity to sustain improvements in employee wellbeing.": { nl: "Blijf de verdeling van de werkdruk en de teamcapaciteit monitoren om de verbeteringen in het welzijn van medewerkers vast te houden.", de: "Beobachten Sie weiterhin die Verteilung der Arbeitsbelastung und die Teamkapazität, um die Verbesserungen beim Wohlbefinden der Mitarbeitenden aufrechtzuerhalten." },
    "Build on the positive momentum by increasing opportunities for employee development, learning, and career growth.": { nl: "Bouw voort op het positieve momentum door meer mogelijkheden te bieden voor ontwikkeling, leren en loopbaangroei.", de: "Bauen Sie auf dem positiven Momentum auf, indem Sie mehr Möglichkeiten für Mitarbeiterentwicklung, Lernen und berufliches Wachstum schaffen." },
    "Recognize and celebrate team achievements to reinforce engagement and advocacy.": { nl: "Erken en vier de successen van het team om de bevlogenheid en het ambassadeurschap te versterken.", de: "Erkennen und feiern Sie die Erfolge des Teams, um Engagement und Mitarbeiter-Engagement zu stärken." },
    "Maintain regular employee feedback discussions to identify emerging concerns early and support continuous improvement.": { nl: "Voer regelmatig feedbackgesprekken met medewerkers om opkomende zorgen vroegtijdig te signaleren en continue verbetering te ondersteunen.", de: "Führen Sie regelmäßig Feedbackgespräche mit den Mitarbeitenden, um aufkommende Anliegen frühzeitig zu erkennen und kontinuierliche Verbesserung zu unterstützen." },
    "Share progress updates on actions taken in response to employee feedback to strengthen trust and accountability.": { nl: "Deel updates over de voortgang van acties die zijn ondernomen naar aanleiding van feedback van medewerkers, om vertrouwen en verantwoordelijkheid te versterken.", de: "Teilen Sie Fortschrittsupdates zu Maßnahmen, die als Reaktion auf das Mitarbeiterfeedback ergriffen wurden, um Vertrauen und Verbindlichkeit zu stärken." },
    "The team has both the energy and the foundations in place to perform well. Engagement and the performance environment reinforce each other, creating the conditions for strong and sustainable results.": { nl: "Het team beschikt zowel over de energie als over de juiste fundamenten om goed te presteren. Bevlogenheid en de werkomgeving versterken elkaar en creëren zo de voorwaarden voor sterke en duurzame resultaten.", de: "Das Team verfügt sowohl über die Energie als auch über die Grundlagen, um gute Leistungen zu erbringen. Engagement und Leistungsumfeld verstärken sich gegenseitig und schaffen so die Voraussetzungen für starke und nachhaltige Ergebnisse." },
    "Here, a light-touch follow-up is enough. Take time to reflect on the results together and acknowledge what is going well. The goal is to keep momentum and avoid overcomplicating something that already works.": { nl: "Hier volstaat een lichte opvolging. Neem samen de tijd om op de resultaten te reflecteren en erken wat goed gaat. Het doel is om het momentum vast te houden en iets wat al werkt niet onnodig ingewikkeld te maken.", de: "Hier genügt eine leichte Nachverfolgung. Nehmen Sie sich gemeinsam Zeit, um über die Ergebnisse nachzudenken, und würdigen Sie, was gut läuft. Das Ziel ist, das Momentum zu halten und etwas, das bereits funktioniert, nicht unnötig zu verkomplizieren." },
    "Reflect on the strengths that stand out in the results.": { nl: "Reflecteer op de sterke punten die opvallen in de resultaten.", de: "Reflektieren Sie über die Stärken, die in den Ergebnissen hervorstechen." },
    "Discuss what helps the team perform at its best.": { nl: "Bespreek wat het team helpt om optimaal te presteren.", de: "Besprechen Sie, was dem Team hilft, seine beste Leistung zu erbringen." },
    "Consider where successful practices could inspire others.": { nl: "Bekijk waar succesvolle werkwijzen anderen kunnen inspireren.", de: "Überlegen Sie, wo erfolgreiche Vorgehensweisen andere inspirieren könnten." },
    "Keep attention on what works well and continue building on it. Use the survey results as an opportunity to reinforce the practices that help the team perform at its best.": { nl: "Houd de aandacht bij wat goed werkt en blijf daarop voortbouwen. Gebruik de onderzoeksresultaten als kans om de werkwijzen te versterken die het team helpen optimaal te presteren.", de: "Behalten Sie im Blick, was gut funktioniert, und bauen Sie weiter darauf auf. Nutzen Sie die Umfrageergebnisse als Gelegenheit, die Vorgehensweisen zu stärken, die dem Team helfen, seine beste Leistung zu erbringen." },

    /* ── Per-variant narrative copy (novanta-after) ── */
    "Across Novanta, this survey shows a healthy and stable picture. Organization-wide engagement stands at 72% and retention at 76%, indicating that most employees feel committed to their work and intend to stay. An eNPS of 30 reflects solid advocacy, and a strong response rate of 81% gives a reliable view of how the organization is doing.": { nl: "Bij Novanta laat dit onderzoek een gezond en stabiel beeld zien. Over de hele organisatie staat de bevlogenheid op 72% en het behoud op 76%, wat erop wijst dat de meeste medewerkers zich verbonden voelen met hun werk en van plan zijn te blijven. Een eNPS van 30 weerspiegelt solide ambassadeurschap, en een sterk responspercentage van 81% geeft een betrouwbaar beeld van hoe het de organisatie vergaat.", de: "Bei Novanta zeigt diese Befragung ein gesundes und stabiles Bild. Organisationsweit liegt das Engagement bei 72% und die Mitarbeiterbindung bei 76%, was darauf hindeutet, dass sich die meisten Mitarbeitenden ihrer Arbeit verbunden fühlen und bleiben möchten. Ein eNPS von 30 spiegelt eine solide Fürsprache wider, und eine starke Rücklaufquote von 81% bietet einen verlässlichen Einblick in die Lage der Organisation." },
    "Most departments sit in the effective quadrant, where engagement and the performance environment reinforce each other. A few teams still have room to grow, particularly around workload and development opportunities, but the overall foundation is strong.": { nl: "De meeste afdelingen bevinden zich in het effectieve kwadrant, waar bevlogenheid en de werkomgeving elkaar versterken. Enkele teams hebben nog ruimte om te groeien, met name op het gebied van werkdruk en ontwikkelingsmogelijkheden, maar het algehele fundament is sterk.", de: "Die meisten Abteilungen befinden sich im effektiven Quadranten, in dem sich Engagement und das Leistungsumfeld gegenseitig verstärken. Einige Teams haben noch Wachstumspotenzial, insbesondere im Bereich Arbeitsbelastung und Entwicklungsmöglichkeiten, doch das Gesamtfundament ist stark." },
    "Continued investment in leadership, recognition and balanced workloads will help Novanta sustain this momentum and lift the teams that are not yet performing at their best.": { nl: "Voortdurende investeringen in leiderschap, erkenning en evenwichtige werkdruk helpen Novanta om dit momentum vast te houden en de teams te tillen die nog niet op hun best presteren.", de: "Kontinuierliche Investitionen in Führung, Anerkennung und ausgewogene Arbeitsbelastung helfen Novanta, diesen Schwung zu erhalten und die Teams zu fördern, die noch nicht ihr volles Potenzial ausschöpfen." },
    "Engagement (72%) is healthy organization-wide and close to the external benchmark.": { nl: "De bevlogenheid (72%) is over de hele organisatie gezond en ligt dicht bij de externe benchmark.", de: "Das Engagement (72%) ist organisationsweit gesund und liegt nahe an der externen Benchmark." },
    "Retention (76%) shows that the large majority of employees intend to stay with Novanta.": { nl: "Het behoud (76%) laat zien dat de grote meerderheid van de medewerkers van plan is bij Novanta te blijven.", de: "Die Mitarbeiterbindung (76%) zeigt, dass die große Mehrheit der Mitarbeitenden bei Novanta bleiben möchte." },
    "eNPS (30) reflects solid advocacy across the organization.": { nl: "De eNPS (30) weerspiegelt solide ambassadeurschap door de hele organisatie heen.", de: "Der eNPS (30) spiegelt eine solide Fürsprache in der gesamten Organisation wider." },
    "A response rate of 81% gives strong confidence in the representativeness of the results.": { nl: "Een responspercentage van 81% geeft veel vertrouwen in de representativiteit van de resultaten.", de: "Eine Rücklaufquote von 81% gibt großes Vertrauen in die Repräsentativität der Ergebnisse." },
    "Workload (62%) varies between departments and remains an opportunity in several teams.": { nl: "De werkdruk (62%) verschilt per afdeling en blijft in meerdere teams een kans.", de: "Die Arbeitsbelastung (62%) variiert zwischen den Abteilungen und bleibt in mehreren Teams ein Ansatzpunkt." },
    "Development opportunities score lower than engagement, suggesting room to strengthen growth and career paths.": { nl: "Ontwikkelingsmogelijkheden scoren lager dan bevlogenheid, wat wijst op ruimte om groei en loopbaanpaden te versterken.", de: "Entwicklungsmöglichkeiten schneiden schlechter ab als das Engagement, was auf Spielraum zur Stärkung von Wachstum und Karrierewegen hindeutet." },
    "Share organization-wide results transparently and let departments set their own focus areas.": { nl: "Deel de organisatiebrede resultaten transparant en laat afdelingen hun eigen focusgebieden bepalen.", de: "Teilen Sie die organisationsweiten Ergebnisse transparent und lassen Sie die Abteilungen ihre eigenen Schwerpunkte setzen." },
    "Support managers of lower-scoring teams with targeted coaching and resources.": { nl: "Ondersteun managers van lager scorende teams met gerichte coaching en middelen.", de: "Unterstützen Sie Führungskräfte von schwächer abschneidenden Teams mit gezieltem Coaching und Ressourcen." },
    "Continue investing in development, recognition and balanced workloads.": { nl: "Blijf investeren in ontwikkeling, erkenning en evenwichtige werkdruk.", de: "Investieren Sie weiterhin in Entwicklung, Anerkennung und ausgewogene Arbeitsbelastung." },
    "Monitor workload distribution across departments to protect wellbeing.": { nl: "Bewaak de verdeling van de werkdruk over afdelingen om het welzijn te beschermen.", de: "Behalten Sie die Verteilung der Arbeitsbelastung über die Abteilungen im Blick, um das Wohlbefinden zu schützen." },
    "Reinforce what works in high-performing teams and spread those practices.": { nl: "Versterk wat werkt in goed presterende teams en verspreid die werkwijzen.", de: "Verstärken Sie, was in leistungsstarken Teams funktioniert, und verbreiten Sie diese Praktiken." },
    "Across the organization, engagement and the performance environment reinforce each other. Most teams have the energy and the foundations in place to perform well and deliver sustainable results.": { nl: "In de hele organisatie versterken bevlogenheid en de werkomgeving elkaar. De meeste teams hebben de energie en de basis op orde om goed te presteren en duurzame resultaten te leveren.", de: "In der gesamten Organisation verstärken sich Engagement und das Leistungsumfeld gegenseitig. Die meisten Teams verfügen über die Energie und die Grundlagen, um gute Leistungen zu erbringen und nachhaltige Ergebnisse zu erzielen." },
    "Here, a light-touch organization-wide follow-up is enough. Acknowledge what is going well and give departments the space to act on their own results. The goal is to keep momentum across the organization.": { nl: "Hier volstaat een lichte, organisatiebrede opvolging. Erken wat goed gaat en geef afdelingen de ruimte om met hun eigen resultaten aan de slag te gaan. Het doel is om het momentum in de hele organisatie vast te houden.", de: "Hier genügt ein behutsames, organisationsweites Follow-up. Würdigen Sie, was gut läuft, und geben Sie den Abteilungen den Raum, mit ihren eigenen Ergebnissen zu arbeiten. Ziel ist es, den Schwung in der gesamten Organisation zu erhalten." },
    "Reflect on the strengths that stand out across the organization.": { nl: "Sta stil bij de sterke punten die in de hele organisatie opvallen.", de: "Reflektieren Sie über die Stärken, die in der gesamten Organisation hervorstechen." },
    "Let each department translate the results into their own focus.": { nl: "Laat elke afdeling de resultaten vertalen naar een eigen focus.", de: "Lassen Sie jede Abteilung die Ergebnisse in ihren eigenen Schwerpunkt übersetzen." },
    "Support the few teams that are not yet performing at their best.": { nl: "Ondersteun de enkele teams die nog niet op hun best presteren.", de: "Unterstützen Sie die wenigen Teams, die noch nicht ihr volles Potenzial ausschöpfen." },
    "Keep attention on what works well and continue building on it across teams.": { nl: "Blijf aandacht houden voor wat goed werkt en bouw daarop voort in alle teams.", de: "Behalten Sie im Blick, was gut funktioniert, und bauen Sie teamübergreifend darauf auf." },

    /* ── Per-variant narrative copy (novanta-before) ── */

<div class="overlay" id="ai-info-overlay" hidden>
  <div class="dialog dialog-s" role="dialog" aria-modal="true" aria-labelledby="ai-info-title">

    <div class="dialog-body ai-info-body">

        <p class="ai-info-fine">This insight is generated with AI to support interpretation and decision-making. It is designed to highlight patterns and signals, not to replace your own expertise or judgment. Effectory uses AI responsibly and in line with our privacy and security standards. No personally identifiable information is used, and customer data is not used to train AI models. All data remains stored in Europe under the same contractual and security terms as the rest of the platform. Learn more about how Effectory uses AI responsibly in our <a class="link-inline" href="#">Security Center</a>.</p>

/* ---------- chart helpers ---------- */
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const rgba = (hex, a) => {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return `rgba(${r},${g},${b},${a})`;
};
/* Shared "score over time" line chart — used by the engagement panel and the per-question
   panel so both look identical: angular line, content-base semibold axis labels with extra
   spacing, dashed blue grid, area gradient. */
/* Survey periods for the "score over time" trend. Q2 view shows the first 5 (ending May 2026);
   Q3 view shows all 6 (ending Sep 2026), matching each dataset's dateTo / prevDateTo. */
function renderOverview(variant) {
  const d = (window.translateData ? translateData(DATA[variant] || DATA['team-it-after']) : (DATA[variant] || DATA['team-it-after']));
  document.getElementById('root').innerHTML = shell(d);

  /* Charts — wait for Poppins so radar labels are not clipped */
  document.fonts.ready.then(() => {
    /* eNPS donut */
    new Chart(document.getElementById('nps-chart'), {
      type: 'doughnut',
      data: {
        labels: ['Promoters', 'Passives', 'Detractors'],
        datasets: [{
          data: [d.npsPromoters, d.npsPassives, d.npsDetractors],
          backgroundColor: [css('--bg-distribution-agree'), css('--bg-distribution-neither'), css('--bg-distribution-disagree')],
          borderWidth: 0
        }]
      },
      options: { rotation: 0, cutout: '82%', responsive: false, events: [], animation: { duration: 800, easing: 'easeOutQuart' }, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
    });

    /* Themes radar */
    const swCur = css('--bg-results-current');
    const swPrev = css('--bg-results-previous');
    new Chart(document.getElementById('sw-chart'), {
      type: 'radar',
      data: {
        labels: ['Engagement', 'Managing systems', 'Facilitating employees', 'Leadership in change', 'Giving direction', 'Employer-ship'].map(s => window.tr ? tr(s) : s),
        datasets: [
          { label: 'Previous', data: d.swPrevious, backgroundColor: rgba(swPrev, 0.54), borderColor: swPrev, borderWidth: 1, pointBackgroundColor: css('--bg-base'), pointBorderColor: css('--border-highlight'), pointBorderWidth: 2, pointRadius: 5 },
          { label: 'Current', data: d.swCurrent, backgroundColor: rgba(swCur, 0.47), borderColor: swCur, borderWidth: 1, pointBackgroundColor: css('--bg-base'), pointBorderColor: css('--border-info'), pointBorderWidth: 2, pointRadius: 5 }
        ]
      },
      options: {
        responsive: false, events: ['mousemove', 'mouseout'], animation: { duration: 800, easing: 'easeOutQuart' },
        layout: { padding: 2 },
        interaction: { mode: 'nearest', intersect: true },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true, backgroundColor: css('--bg-inverse'), padding: 8, cornerRadius: 8, displayColors: false,
            titleFont: { family: 'Poppins', size: 12, weight: 600 }, bodyFont: { family: 'Poppins', size: 12, weight: 500 },
            callbacks: { title: (items) => items[0].label, label: (item) => `${item.dataset.label}: ${item.formattedValue}%` }
          }
        },
        scales: { r: { min: 0, max: 100, ticks: { display: false, stepSize: 25 }, grid: { color: css('--border-base') }, angleLines: { color: css('--border-base') }, pointLabels: { color: css('--content-base'), padding: 6, font: { family: 'Poppins', size: 11, weight: 500 }, callback: (label) => {
          if (label.length <= 13) return label;
          const words = String(label).split(' ');
          if (words.length < 2) return label;
          let best = 1, bestDiff = Infinity, total = label.length;
          for (let i = 1; i < words.length; i++) { const a = words.slice(0, i).join(' ').length; const diff = Math.abs(a - (total - a)); if (diff < bestDiff) { bestDiff = diff; best = i; } }
          return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
        } } } }
      }
    });
  });

  /* AI summary show more / less — the height animates, so max-height is always a real value
     while the motion runs: measured px on the way out, the CSS peek height on the way back.
     Once expanded it is released to `none` so a resize or language switch cannot clip it. */
  const aiSummary = document.getElementById('ai-summary');
  const aiToggle = document.getElementById('ai-toggle');
  const aiBody = document.getElementById('ai-body');
  const aiReduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  let aiRelease = 0;
  const releaseHeight = () => { if (aiSummary.classList.contains('is-open')) aiBody.style.maxHeight = 'none'; };
  aiBody.addEventListener('transitionend', (e) => {
    if (e.target === aiBody && e.propertyName === 'max-height') { clearTimeout(aiRelease); releaseHeight(); }
  });

  aiToggle.addEventListener('click', () => {
    const open = !aiSummary.classList.contains('is-open');
    aiToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    clearTimeout(aiRelease);
    if (open) {
      aiSummary.classList.add('is-open');
      if (aiReduced()) { releaseHeight(); return; }
      aiBody.style.maxHeight = aiBody.scrollHeight + 'px';
      /* Safety net: a throttled/background tab can stall the transition, and a pinned
         max-height would clip the summary after a resize. 400ms > --motion-slow (300ms). */
      aiRelease = setTimeout(releaseHeight, 400);
    } else {
      /* Pin the current height first — a collapse from `none` has nothing to animate away
         from. Reading offsetHeight flushes it so the peek height becomes a real transition. */
      aiBody.style.maxHeight = aiBody.scrollHeight + 'px';
      void aiBody.offsetHeight;
      aiSummary.classList.remove('is-open');
      aiBody.style.maxHeight = '';
    }
  });

  /* "Learn more" in the disclaimer opens the "How this summary is created" dialog.
     Closing plays the exit animation first (design system §9) instead of yanking the
     overlay out in one frame. */
  const aiInfo = document.getElementById('ai-info-overlay');
  const openAiInfo = () => { aiInfo.classList.remove('is-closing'); aiInfo.hidden = false; };
  const closeAiInfo = () => {
    if (aiInfo.hidden || aiInfo.classList.contains('is-closing')) return;
    const dlg = aiInfo.querySelector('.dialog');
    let settled = false, timer = 0;
    const done = () => {
      if (settled) return;
      settled = true; clearTimeout(timer);
      aiInfo.hidden = true; aiInfo.classList.remove('is-closing');
    };
    aiInfo.classList.add('is-closing');
    if (dlg && !aiReduced()) {
      dlg.addEventListener('animationend', done, { once: true });
      /* Safety net: a throttled tab can stall the animation, and a half-closed overlay
         would keep swallowing clicks. 300ms > --motion-base (150ms). */
      timer = setTimeout(done, 300);
    } else { done(); }
  };
  document.getElementById('ai-learn').addEventListener('click', openAiInfo);
  document.getElementById('ai-info-close').addEventListener('click', closeAiInfo);
  document.getElementById('ai-info-ok').addEventListener('click', closeAiInfo);
  aiInfo.addEventListener('click', (e) => { if (e.target === aiInfo) closeAiInfo(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !aiInfo.hidden) closeAiInfo(); });

  /* Translate the fixed UI text (nav, tabs, headings, buttons …) */
  if (window.translateDOM) translateDOM(document.getElementById('root'));

  /* Language popover (click the user's name in the sidebar) */
  const userBtn = document.getElementById('mn-user-btn');
  const langPop = document.getElementById('lang-pop');
  if (userBtn && langPop) {
    langPop.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('is-active', b.dataset.lang === (window.LANG || 'en'));
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        if (window.setLang) setLang(b.dataset.lang);
        renderOverview(variant);
      });
    });
    userBtn.addEventListener('click', (e) => { e.stopPropagation(); langPop.hidden = !langPop.hidden; });
    document.addEventListener('click', () => { langPop.hidden = true; });
  }

  /* Header filter: toggle between team level (Team IT) and organization level (Novanta).
     Survey name / date range: toggle the survey period (Q2 <-> Q3).
     Both reload THIS file with a different data variant (?v=), so the blur focus-pull
     transition plays as designed. */
  const goVariant = (group, period) => { location.href = `${location.pathname}?v=${group}-${period}`; };

  document.getElementById('hdr-filter')?.addEventListener('click', () => {
    const period = variant.endsWith('-before') ? 'before' : 'after';
    goVariant(variant.startsWith('novanta') ? 'team-it' : 'novanta', period);
  });

  const switchPeriod = () => {
    const group = variant.startsWith('novanta') ? 'novanta' : 'team-it';
    goVariant(group, variant.endsWith('-before') ? 'after' : 'before');
  };
  document.querySelector('.results-title')?.addEventListener('click', switchPeriod);
  document.querySelector('.date-range')?.addEventListener('click', switchPeriod);

  /* Icons */
  if (window.Icons) Icons.render(document);
}

/* ---------- Tooltip auto-position ----------
   Render the bubble in a fixed layer so no overflow:hidden ancestor (cards,
   scroll containers) can clip it. Delegated on document so it survives the
   in-place re-renders of #root. On hover/focus: measure the trigger, pick the
   first direction that fits (preferred side first, then above > below > right
   > left), and place the bubble with position:fixed, clamped to the viewport.
   See design-system-reference.md → Tooltip. */
(function () {
  const GAP = 10, PAD = 8;
  const place = (demo) => {
    const tip = demo.querySelector('.tooltip');
    if (!tip) return;
    tip.style.position = 'fixed';
    tip.style.margin = '0';
    tip.style.transform = 'none';
    tip.style.left = '0';
    tip.style.top = '0';
    tip.style.right = 'auto';
    tip.style.bottom = 'auto';
    tip.style.height = 'auto';
    const t = demo.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    const pref = tip.classList.contains('is-below') ? 'below'
      : tip.classList.contains('is-left') ? 'left'
      : tip.classList.contains('is-right') ? 'right' : 'above';
    const fits = {
      above: t.top - th - GAP >= PAD,
      below: t.bottom + th + GAP <= vh - PAD,
      left:  t.left - tw - GAP >= PAD,
      right: t.right + tw + GAP <= vw - PAD
    };
    const dir = [pref, 'above', 'below', 'right', 'left'].find(d => fits[d]) || pref;
    let x, y;
    if (dir === 'above')      { x = t.left + t.width / 2 - tw / 2; y = t.top - th - GAP; }
    else if (dir === 'below') { x = t.left + t.width / 2 - tw / 2; y = t.bottom + GAP; }
    else if (dir === 'left')  { x = t.left - tw - GAP; y = t.top + t.height / 2 - th / 2; }
    else                      { x = t.right + GAP; y = t.top + t.height / 2 - th / 2; }
    tip.style.left = Math.max(PAD, Math.min(x, vw - tw - PAD)) + 'px';
    tip.style.top = Math.max(PAD, Math.min(y, vh - th - PAD)) + 'px';
    tip.classList.remove('is-above', 'is-below', 'is-left', 'is-right');
    tip.classList.add('is-' + dir);
  };
  const onEnter = (e) => {
    const demo = e.target.closest && e.target.closest('.tt-demo');
    if (demo) place(demo);
  };
  document.addEventListener('mouseover', onEnter);
  document.addEventListener('focusin', onEnter);
})();

  
  </script>
  <script>
    /* Group/period switches reload this file with ?v=<group>-<period>. */
    (function () { const v = new URLSearchParams(location.search).get('v'); renderOverview(DATA[v] ? v : 'team-it-after'); })();
  </script>
