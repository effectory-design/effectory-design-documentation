<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview (design-system) — embed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="foundation.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="effectiveness.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("effx-theme")||"light")}catch(e){}</script>
  <style>
    html, body { margin: 0; background: var(--bg-interface-body); }
    /* Render the full design-system results app, then crop to just the Overview content. */
    .mainnav, .breadcrumb, .results-head, .fb-fab, #fb-btn { display: none !important; }
    .app { display: block !important; height: auto !important; overflow: visible !important; }
    .main { display: block !important; min-width: 0 !important; }
    .main-scroll { overflow: visible !important; height: auto !important; }
    /* Trim the design-system's generous top/bottom gutters so the embed has no dead scroll space. */
    .overview-wrap { padding-top: var(--spacing-loose) !important; padding-bottom: var(--spacing-base) !important; }
    /* Keep the 3-up card grid — the DS drops to 2-up below a 1300px *viewport*, which the iframe always is. */
    @media (min-width: 900px) {
      .ov-grid { grid-template-columns: repeat(3, minmax(0, 384px)) !important; max-width: 1200px !important; }
      .ai-summary { max-width: 1200px !important; }
    }
    /* Score cards: drop the card-header pin; the triage entry point is a per-row pin next to each score. */
    .qs-card .sc-pin-wrap { display: none !important; }
    .qs-card .qs-row { align-items: center; }
    .ov-row-pin {
      flex: none; width: 28px; height: 28px; margin-left: var(--spacing-tight);
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: var(--radius-base); background: var(--bg-secondary);
      color: var(--content-secondary); cursor: pointer; transition: background .12s ease, color .12s ease;
    }
    .ov-row-pin:hover { background: var(--bg-tertiary); color: var(--content-base); }
    .ov-row-pin i { display: flex; width: 15px; height: 15px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="effectiveness.js"></script>
  <script>
    // Render the design-system Overview (exact reference dataset + real Chart.js charts).
    renderOverview('team-it-after', 'overview');

    // Add a small pin button next to each score in the Highest/Lowest cards. Clicking it opens the
    // prototype's triage dialog straight away (no goal popover) for that question.
    function addRowPins(){
      [['is-low', 'low'], ['is-high', 'high']].forEach(function(pair){
        document.querySelectorAll('.qs-card.' + pair[0] + ' .qs-row').forEach(function(row){
          if(row.querySelector('.ov-row-pin')) return;
          var scoreEl = row.querySelector('.qs-row-score');
          var q = (row.querySelector('.qs-row-q') || {}).textContent || '';
          var s = scoreEl ? scoreEl.textContent : '';
          var btn = document.createElement('button');
          btn.className = 'ov-row-pin';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Respond to this question');
          btn.innerHTML = '<i data-icon="pin"></i>';
          btn.addEventListener('click', function(e){
            e.stopPropagation(); e.preventDefault();
            if(window.parent && window.parent.openScoreStepFromEmbed){
              window.parent.openScoreStepFromEmbed(q.trim(), (s || '').trim(), pair[1]);
            }
          });
          (scoreEl || row).insertAdjacentElement(scoreEl ? 'afterend' : 'beforeend', btn);
        });
      });
      if(window.Icons) window.Icons.render(document.body);
    }

    // Report content height so the parent can size the iframe with no inner (or trailing) scroll.
    function reportHeight(){
      var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      try { if(window.parent) window.parent.postMessage({ type: 'ov-embed-height', height: h }, '*'); } catch(e){}
    }
    function boot(){ addRowPins(); reportHeight(); setTimeout(function(){ addRowPins(); reportHeight(); }, 250); setTimeout(reportHeight, 800); }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ setTimeout(boot, 60); }); }
    window.addEventListener('load', function(){ setTimeout(boot, 120); });
    window.addEventListener('resize', reportHeight);
  </script>
</body>
</html>
